<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StepClub — Чат</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  :root{
    --bg:#06060b;
    --panel:rgba(18,18,30,.72);
    --border:rgba(255,255,255,.08);
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --text:#e9e9f2;
    --muted:#8a8aa3;
  }

  html,body{height:100%}

  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Inter',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ФОН ---------- */
  body::before{
    content:'';
    position:fixed;
    inset:-40%;
    background:
      radial-gradient(circle at 18% 18%, rgba(124,92,255,.30), transparent 42%),
      radial-gradient(circle at 82% 72%, rgba(34,211,238,.20), transparent 42%),
      radial-gradient(circle at 50% 105%, rgba(236,72,153,.18), transparent 48%);
    filter:blur(60px);
    animation:float 20s ease-in-out infinite alternate;
    z-index:0;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    z-index:0;
    pointer-events:none;
  }
  @keyframes float{
    0%  {transform:translate3d(-3%,-2%,0) scale(1)}
    50% {transform:translate3d(2%,3%,0) scale(1.08)}
    100%{transform:translate3d(3%,-3%,0) scale(1.03)}
  }

  .hidden{display:none !important}

  /* ---------- ЭКРАН ВХОДА ---------- */
  #loginScreen{
    position:relative;
    z-index:2;
    height:100dvh;
    display:grid;
    place-items:center;
    padding:20px;
  }

  .login-card{
    width:min(430px,94vw);
    padding:44px 34px 34px;
    border-radius:26px;
    background:linear-gradient(160deg, rgba(30,30,48,.85), rgba(12,12,22,.92));
    border:1px solid var(--border);
    box-shadow:
      0 40px 90px rgba(0,0,0,.7),
      0 0 0 1px rgba(124,92,255,.10),
      inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    animation:cardIn .55s cubic-bezier(.2,.9,.3,1.2);
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:'';
    position:absolute;
    top:-60%;left:-30%;
    width:160%;height:120%;
    background:radial-gradient(circle at 50% 0%, rgba(124,92,255,.28), transparent 60%);
    pointer-events:none;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.96)}
    to{opacity:1;transform:none}
  }

  .logo{
    font-size:42px;
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1;
    text-align:center;
    background:linear-gradient(100deg,#fff 10%, var(--accent) 45%, var(--accent2) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(124,92,255,.45));
    position:relative;
  }

  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:14px 0 30px;
    position:relative;
  }

  .field{position:relative;margin-bottom:14px}

  .input{
    width:100%;
    padding:15px 18px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .input::placeholder{color:#5f5f78}
  .input:focus{
    border-color:rgba(124,92,255,.75);
    background:rgba(124,92,255,.07);
    box-shadow:0 0 0 4px rgba(124,92,255,.14);
  }
  .input.invalid{
    border-color:rgba(255,80,110,.75);
    box-shadow:0 0 0 4px rgba(255,80,110,.13);
  }

  .btn-primary{
    width:100%;
    padding:15px 20px;
    margin-top:6px;
    border:none;
    border-radius:15px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(120deg, var(--accent), #a855f7 45%, var(--accent2));
    background-size:200% 100%;
    box-shadow:0 12px 34px rgba(124,92,255,.42);
    transition:transform .16s, box-shadow .22s, background-position .5s;
  }
  .btn-primary:hover{
    transform:translateY(-2px);
    background-position:100% 0;
    box-shadow:0 18px 42px rgba(124,92,255,.55);
  }
  .btn-primary:active{transform:translateY(0) scale(.985)}

  .error{
    min-height:20px;
    margin-top:12px;
    font-size:13.5px;
    color:#ff6b8a;
    text-align:center;
    opacity:0;
    transform:translateY(-4px);
    transition:.22s;
  }
  .error.show{opacity:1;transform:none}

  .hint{
    margin-top:18px;
    text-align:center;
    font-size:12px;
    color:#55556b;
    line-height:1.6;
  }

  /* ---------- ЧАТ ---------- */
  #chatScreen{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100dvh;
  }

  .header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 20px;
    background:rgba(10,10,18,.62);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .header-logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.6px;
    background:linear-gradient(100deg,#fff, var(--accent) 60%, var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }

  .online-pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 13px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    color:#9fe8d8;
    background:rgba(34,211,238,.09);
    border:1px solid rgba(34,211,238,.24);
    white-space:nowrap;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#2ee6a8;
    box-shadow:0 0 10px #2ee6a8;
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.75)}
  }

  .spacer{flex:1}

  .user-chip{
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 6px 5px 5px;
    border-radius:999px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
  }
  .user-chip .name{
    font-size:13.5px;
    font-weight:600;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .avatar{
    width:38px;height:38px;
    flex:0 0 38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:15px;
    color:#fff;
    text-transform:uppercase;
    background:linear-gradient(135deg,
      hsl(var(--hue) 85% 62%),
      hsl(calc(var(--hue) + 55) 82% 46%));
    box-shadow:0 4px 16px hsl(var(--hue) 85% 55% / .38);
    user-select:none;
  }
  .user-chip .avatar{width:30px;height:30px;flex-basis:30px;font-size:12.5px}

  .icon-btn{
    width:36px;height:36px;
    flex:0 0 36px;
    display:grid;place-items:center;
    border-radius:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    cursor:pointer;
    transition:.18s;
  }
  .icon-btn:hover{
    color:#ff7a95;
    border-color:rgba(255,90,120,.4);
    background:rgba(255,90,120,.10);
  }

  /* ---------- ЛЕНТА СООБЩЕНИЙ ---------- */
  .messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 20px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
    scroll-behavior:smooth;
    overscroll-behavior:contain;
  }
  .messages::-webkit-scrollbar{width:9px}
  .messages::-webkit-scrollbar-track{background:transparent}
  .messages::-webkit-scrollbar-thumb{
    background:rgba(124,92,255,.30);
    border-radius:99px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  .messages::-webkit-scrollbar-thumb:hover{background:rgba(124,92,255,.55);background-clip:content-box}

  .day{
    align-self:center;
    margin:18px 0 10px;
    padding:5px 15px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.4px;
    color:var(--muted);
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    border-radius:999px;
    text-transform:uppercase;
  }

  .msg{
    display:flex;
    align-items:flex-end;
    gap:11px;
    padding:4px 8px;
    border-radius:14px;
    animation:msgIn .28s cubic-bezier(.2,.9,.3,1.1);
    transition:background .15s;
  }
  .msg:hover{background:rgba(255,255,255,.028)}
  @keyframes msgIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }

  .msg.own{flex-direction:row-reverse}

  .bubble{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
    max-width:min(660px,76%);
    padding:8px 14px 9px;
    border-radius:16px;
    border-top-left-radius:5px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.055);
  }
  .msg.own .bubble{
    border-top-left-radius:16px;
    border-top-right-radius:5px;
    background:linear-gradient(135deg, rgba(124,92,255,.30), rgba(34,211,238,.14));
    border-color:rgba(124,92,255,.34);
  }

  .meta{
    display:flex;
    align-items:baseline;
    gap:9px;
    line-height:1;
  }
  .msg.own .meta{flex-direction:row-reverse}

  .nick{
    font-size:13px;
    font-weight:700;
    letter-spacing:.1px;
  }
  .time{
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }

  .text{
    font-size:14.6px;
    line-height:1.48;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
  }

  .empty{
    margin:auto;
    text-align:center;
    color:#55556b;
    font-size:14px;
    line-height:1.8;
    padding:30px;
  }
  .empty b{
    display:block;
    font-size:34px;
    margin-bottom:10px;
    filter:grayscale(.3);
  }

  /* ---------- ПОЛЕ ВВОДА ---------- */
  .composer{
    flex:0 0 auto;
    display:flex;
    align-items:flex-end;
    gap:11px;
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:rgba(10,10,18,.62);
    border-top:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .composer textarea{
    flex:1 1 auto;
    resize:none;
    max-height:140px;
    padding:13px 17px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    line-height:1.45;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
    scrollbar-width:thin;
  }
  .composer textarea::placeholder{color:#5f5f78}
  .composer textarea:focus{
    border-color:rgba(124,92,255,.7);
    background:rgba(124,92,255,.06);
    box-shadow:0 0 0 4px rgba(124,92,255,.13);
  }

  .send-btn{
    width:48px;height:48px;
    flex:0 0 48px;
    display:grid;place-items:center;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 10px 26px rgba(124,92,255,.42);
    transition:transform .16s, box-shadow .22s, filter .2s;
  }
  .send-btn:hover{transform:translateY(-2px);box-shadow:0 15px 34px rgba(124,92,255,.58)}
  .send-btn:active{transform:scale(.93)}
  .send-btn svg{width:21px;height:21px}

  /* ---------- МОБИЛЬНАЯ АДАПТАЦИЯ ---------- */
  @media (max-width:640px){
    .header{padding:11px 13px;gap:9px}
    .header-logo{font-size:17px}
    .online-pill{padding:5px 10px;font-size:11.5px}
    .user-chip .name{display:none}
    .user-chip{padding:4px}
    .messages{padding:14px 12px 6px}
    .composer{padding:11px 12px calc(13px + env(safe-area-inset-bottom));gap:9px}
    .bubble{max-width:82%}
    .avatar{width:34px;height:34px;flex-basis:34px;font-size:13.5px}
    .login-card{padding:36px 24px 28px}
    .logo{font-size:36px}
  }
</style>
</head>
<body>

<!-- ================= ЭКРАН ВХОДА ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">StepClub</div>
    <p class="tagline">Введи свободный ник и заходи в чат</p>

    <div class="field">
      <input id="nameInput" class="input" type="text" placeholder="Твой ник"
             maxlength="16" autocomplete="off" spellcheck="false">
    </div>

    <button id="joinBtn" class="btn-primary">Войти в чат</button>
    <div id="loginError" class="error"></div>
    <div class="hint">3–16 символов · буквы, цифры, «_»<br>История чата сохраняется навсегда</div>
  </div>
</div>

<!-- ================= ЧАТ ================= -->
<div id="chatScreen" class="hidden">

  <header class="header">
    <div class="header-logo">StepClub</div>
    <div class="online-pill"><span class="dot"></span><span id="onlineCount">1</span>&nbsp;онлайн</div>
    <div class="spacer"></div>
    <div class="user-chip">
      <div class="avatar" id="userAvatar">?</div>
      <span class="name" id="userName">—</span>
    </div>
    <button class="icon-btn" id="logoutBtn" title="Выйти">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <main class="messages" id="messages">
    <div class="empty" id="emptyState">
      <b>💬</b>
      Пока здесь тихо.<br>Напиши первое сообщение!
    </div>
  </main>

  <div class="composer">
    <textarea id="msgInput" rows="1" placeholder="Написать сообщение..." maxlength="2000"></textarea>
    <button class="send-btn" id="sendBtn" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ============ КОНСТАНТЫ ============ */
  const LS_MSG     = 'stepclub_messages_v1';
  const LS_ONLINE  = 'stepclub_online_v1';
  const SS_ME      = 'stepclub_me';
  const ONLINE_TTL = 20000;   // мс — через сколько ник считается свободным
  const HEARTBEAT  = 5000;    // мс — как часто продлеваем «онлайн»
  const MAX_MSG    = 5000;    // максимум сообщений в хранилище

  /* ============ DOM ============ */
  const loginScreen = document.getElementById('loginScreen');
  const chatScreen  = document.getElementById('chatScreen');
  const nameInput   = document.getElementById('nameInput');
  const joinBtn     = document.getElementById('joinBtn');
  const loginError  = document.getElementById('loginError');

  const messagesEl  = document.getElementById('messages');
  const emptyState  = document.getElementById('emptyState');
  const msgInput    = document.getElementById('msgInput');
  const sendBtn     = document.getElementById('sendBtn');
  const logoutBtn   = document.getElementById('logoutBtn');
  const onlineCount = document.getElementById('onlineCount');
  const userAvatar  = document.getElementById('userAvatar');
  const userName    = document.getElementById('userName');

  /* ============ СОСТОЯНИЕ ============ */
  let currentUser = null;
  let heartbeatTimer = null;
  let lastDayKey = null;
  const renderedIds = new Set();

  /* ============ ХРАНИЛИЩЕ ============ */
  function getMessages() {
    try {
      const raw = localStorage.getItem(LS_MSG);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveMessage(msg) {
    const arr = getMessages();
    arr.push(msg);
    if (arr.length > MAX_MSG) arr.splice(0, arr.length - MAX_MSG);
    try { localStorage.setItem(LS_MSG, JSON.stringify(arr)); } catch (e) {}
  }

  function getOnline() {
    let obj = {};
    try { obj = JSON.parse(localStorage.getItem(LS_ONLINE) || '{}') || {}; } catch (e) {}
    const now = Date.now();
    const fresh = {};
    for (const k in obj) {
      if (typeof obj[k] === 'number' && now - obj[k] < ONLINE_TTL) fresh[k] = obj[k];
    }
    return fresh;
  }

  function writeOnline(obj) {
    try { localStorage.setItem(LS_ONLINE, JSON.stringify(obj)); } catch (e) {}
  }

  function setOnline(name) {
    const o = getOnline();
    o[name] = Date.now();
    writeOnline(o);
  }

  function removeOnline(name) {
    const o = getOnline();
    delete o[name];
    writeOnline(o);
  }

  /* ============ УТИЛИТЫ ============ */
  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h) || 1;
  }

  function dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  }

  function formatDay(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date();
    yest.setDate(today.getDate() - 1);
    if (dayKey(ts) === dayKey(today.getTime())) return 'Сегодня';
    if (dayKey(ts) === dayKey(yest.getTime())) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function isValidName(n) {
    return /^[A-Za-zА-Яа-яЁё0-9_]{3,16}$/.test(n);
  }

  /* ============ КАНАЛ МЕЖДУ ВКЛАДКАМИ ============ */
  let bc = null;
  try { if ('BroadcastChannel' in window) bc = new BroadcastChannel('stepclub'); } catch (e) { bc = null; }

  /* ============ ОТРИСОВКА СООБЩЕНИЙ ============ */
  function createMessageEl(msg) {
    const isOwn = currentUser && msg.name.toLowerCase() === currentUser.toLowerCase();

    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isOwn ? ' own' : '');
    wrap.dataset.id = msg.id;

    const hue = hashCode(msg.name) % 360;

    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.setProperty('--hue', hue);
    av.textContent = msg.name.charAt(0);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const meta = document.createElement('div');
    meta.className = 'meta';

    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = msg.name;
    nick.style.color = 'hsl(' + hue + ' 88% 72%)';

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = formatTime(msg.ts);

    meta.appendChild(nick);
    meta.appendChild(time);

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = msg.text;

    bubble.appendChild(meta);
    bubble.appendChild(text);
    wrap.appendChild(av);
    wrap.appendChild(bubble);

    return wrap;
  }

  function scrollToBottom(smooth) {
    if (smooth) {
      messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    } else {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  function appendMessage(msg, doScroll) {
    if (renderedIds.has(msg.id)) return;
    renderedIds.add(msg.id);

    if (emptyState) emptyState.style.display = 'none';

    const key = dayKey(msg.ts);
    if (key !== lastDayKey) {
      lastDayKey = key;
      const day = document.createElement('div');
      day.className = 'day';
      day.textContent = formatDay(msg.ts);
      messagesEl.appendChild(day);
    }

    messagesEl.appendChild(createMessageEl(msg));
    if (doScroll !== false) scrollToBottom(true);
  }

  function renderAll() {
    messagesEl.querySelectorAll('.msg, .day').forEach(function (n) { n.remove(); });
    renderedIds.clear();
    lastDayKey = null;

    const all = getMessages();
    all.forEach(function (m) { appendMessage(m, false); });

    if (all.length === 0 && emptyState) emptyState.style.display = '';
    scrollToBottom(false);
  }

  /* ============ ОНЛАЙН ============ */
  function updateOnline() {
    const n = Object.keys(getOnline()).length;
    onlineCount.textContent = n;
  }

  function startHeartbeat() {
    clearInterval(heartbeatTimer);
    heartbeatTimer = setInterval(function () {
      if (currentUser) { setOnline(currentUser); updateOnline(); }
    }, HEARTBEAT);
  }

  /* ============ ВХОД ============ */
  function showError(text) {
    loginError.textContent = text;
    loginError.classList.add('show');
    nameInput.classList.add('invalid');
    setTimeout(function () { nameInput.classList.remove('invalid'); }, 900);
  }

  function clearError() {
    loginError.classList.remove('show');
    nameInput.classList.remove('invalid');
  }

  function tryJoin() {
    const name = nameInput.value.trim();

    if (!name) { showError('Введи ник'); return; }
    if (!isValidName(name)) {
      showError('3–16 символов: буквы, цифры и «_»');
      return;
    }

    const online = getOnline();
    const taken = Object.keys(online).some(function (n) {
      return n.toLowerCase() === name.toLowerCase();
    });

    if (taken) { showError('Этот ник сейчас занят — выбери другой'); return; }

    clearError();
    currentUser = name;
    try { sessionStorage.setItem(SS_ME, name); } catch (e) {}
    enterChat();
  }

  function enterChat() {
    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');

    const hue = hashCode(currentUser) % 360;
    userAvatar.textContent = currentUser.charAt(0);
    userAvatar.style.setProperty('--hue', hue);
    userName.textContent = currentUser;

    setOnline(currentUser);
    updateOnline();
    startHeartbeat();

    renderAll();
    setTimeout(function () { msgInput.focus(); scrollToBottom(false); }, 40);
  }

  function logout() {
    if (currentUser) removeOnline(currentUser);
    clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    currentUser = null;
    try { sessionStorage.removeItem(SS_ME); } catch (e) {}

    chatScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    nameInput.value = '';
    clearError();
    nameInput.focus();
  }

  /* ============ ОТПРАВКА ============ */
  function sendMessage() {
    if (!currentUser) return;
    const text = msgInput.value.trim();
    if (!text) return;

    const msg = {
      id: uid(),
      name: currentUser,
      text: text.slice(0, 2000),
      ts: Date.now()
    };

    saveMessage(msg);
    appendMessage(msg, true);

    if (bc) {
      try { bc.postMessage({ type: 'msg', msg: msg }); } catch (e) {}
    }

    msgInput.value = '';
    autoGrow();
    msgInput.focus();
  }

  function autoGrow() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
  }

  /* ============ СОБЫТИЯ ============ */
  joinBtn.addEventListener('click', tryJoin);

  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); tryJoin(); }
  });
  nameInput.addEventListener('input', clearError);

  sendBtn.addEventListener('click', sendMessage);

  msgInput.addEventListener('input', autoGrow);

  msgInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  logoutBtn.addEventListener('click', logout);

  window.addEventListener('beforeunload', function () {
    if (currentUser) removeOnline(currentUser);
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && currentUser) { setOnline(currentUser); updateOnline(); }
  });

  /* Приём сообщений из других вкладок */
  if (bc) {
    bc.onmessage = function (e) {
      const data = e.data || {};
      if (data.type === 'msg' && data.msg) {
        appendMessage(data.msg, true);
      } else if (data.type === 'online') {
        updateOnline();
      }
    };
  }

  /* Резервная синхронизация через storage */
  window.addEventListener('storage', function (e) {
    if (e.key === LS_MSG) {
      getMessages().forEach(function (m) {
        if (!renderedIds.has(m.id)) appendMessage(m, true);
      });
    }
    if (e.key === LS_ONLINE) updateOnline();
  });

  /* ============ СТАРТ ============ */
  (function init() {
    // подчищаем просроченные записи онлайна
    writeOnline(getOnline());

    let saved = null;
    try { saved = sessionStorage.getItem(SS_ME); } catch (e) {}

    if (saved && isValidName(saved)) {
      currentUser = saved;
      enterChat();
    } else {
      loginScreen.classList.remove('hidden');
      chatScreen.classList.add('hidden');
      setTimeout(function () { nameInput.focus(); }, 200);
    }
  })();

})();
</script>
</body>
</html>
