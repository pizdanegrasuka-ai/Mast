<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mast — мессенджер</title>
<style>
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080d;
  --panel:#0d0f17;
  --panel-2:#12151f;
  --panel-3:#181c29;
  --line:#1e2333;
  --line-2:#2a3145;
  --text:#e9ebf5;
  --muted:#7d849c;
  --muted-2:#5b6178;
  --accent:#6d5cff;
  --accent-2:#a855f7;
  --accent-grad:linear-gradient(135deg,#6d5cff 0%,#a855f7 100%);
  --green:#2ee08a;
  --red:#ff4d6d;
  --radius:16px;
  --shadow:0 24px 70px rgba(0,0,0,.6);
}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:
    radial-gradient(900px 620px at 10% -12%, rgba(109,92,255,.20), transparent 62%),
    radial-gradient(820px 600px at 105% 112%, rgba(168,85,247,.16), transparent 62%),
    var(--bg);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}
button,input{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
.hidden{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232a3c;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#323b52;background-clip:padding-box}

/* ============ AUTH ============ */
.auth{
  position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:50;
}
.auth::before{
  content:'';position:absolute;width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle,rgba(109,92,255,.28),transparent 65%);
  filter:blur(60px);top:-160px;left:-120px;pointer-events:none;
  animation:float 14s ease-in-out infinite alternate;
}
.auth::after{
  content:'';position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.22),transparent 65%);
  filter:blur(70px);bottom:-180px;right:-120px;pointer-events:none;
  animation:float 18s ease-in-out infinite alternate-reverse;
}
@keyframes float{to{transform:translate(60px,50px) scale(1.12)}}
.auth-card{
  position:relative;width:100%;max-width:404px;
  background:linear-gradient(180deg,rgba(20,23,34,.92),rgba(13,15,23,.96));
  border:1px solid var(--line);
  border-radius:26px;
  padding:38px 34px 30px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(22px);
  animation:pop .45s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.brand-lg{
  font-size:44px;font-weight:800;letter-spacing:-2px;
  background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  line-height:1;text-align:center;
}
.auth-tagline{text-align:center;color:var(--muted);font-size:13.5px;margin-top:10px;margin-bottom:26px}
.seg{
  display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);
  border-radius:13px;padding:4px;margin-bottom:22px;
}
.seg-btn{
  flex:1;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:600;
  color:var(--muted);transition:.18s;display:flex;align-items:center;justify-content:center;gap:7px;
}
.seg-btn:hover{color:var(--text)}
.seg-btn.active{background:var(--accent-grad);color:#fff;box-shadow:0 6px 18px rgba(109,92,255,.35)}
.seg.small{margin:0 14px 12px;padding:3px}
.seg.small .seg-btn{padding:7px 10px;font-size:13px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px;letter-spacing:.2px}
.input-wrap{
  display:flex;align-items:center;gap:2px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:13px;padding:0 14px;transition:.2s;
}
.input-wrap:focus-within{border-color:rgba(109,92,255,.75);box-shadow:0 0 0 4px rgba(109,92,255,.13);background:#141828}
.input-wrap .at{color:var(--muted-2);font-weight:600}
.input-wrap input{
  flex:1;padding:13px 0;background:none;font-size:15px;width:100%;
}
.input-wrap input::placeholder{color:var(--muted-2)}
.auth-msg{
  font-size:13px;min-height:18px;margin:2px 0 12px;color:var(--red);
  opacity:0;transition:.2s;font-weight:500;
}
.auth-msg.show{opacity:1}
.auth-msg.ok{color:var(--green)}
.btn-primary{
  width:100%;padding:14px;border-radius:13px;background:var(--accent-grad);
  font-weight:700;font-size:15px;color:#fff;letter-spacing:.2px;
  box-shadow:0 10px 28px rgba(109,92,255,.36);transition:.18s;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(109,92,255,.46)}
.btn-primary:active{transform:translateY(0) scale(.99)}
.auth-foot{text-align:center;color:var(--muted-2);font-size:11.5px;margin-top:20px;line-height:1.5}

/* ============ APP LAYOUT ============ */
.app{position:fixed;inset:0;display:flex;opacity:0;pointer-events:none;transition:.3s}
.app.on{opacity:1;pointer-events:auto}
.sidebar{
  width:340px;flex:0 0 340px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(16,19,29,.86),rgba(11,13,20,.94));
  border-right:1px solid var(--line);backdrop-filter:blur(18px);
}
.side-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 18px 14px;
}
.brand{
  font-size:25px;font-weight:800;letter-spacing:-1.2px;
  background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.me{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 6px;border-radius:12px;transition:.18s}
.me:hover{background:var(--panel-2)}
.me-name{font-size:13.5px;font-weight:600;max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:var(--muted);transition:.18s;background:transparent;flex:0 0 auto;
}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.icon-btn.danger:hover{color:var(--red);background:rgba(255,77,109,.12)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.search{position:relative;margin:0 14px 12px}
.search svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;stroke:var(--muted-2);fill:none;stroke-width:2;stroke-linecap:round;
}
.search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px 11px 39px;font-size:14px;transition:.2s;
}
.search input::placeholder{color:var(--muted-2)}
.search input:focus{border-color:rgba(109,92,255,.6);background:#141828;box-shadow:0 0 0 4px rgba(109,92,255,.1)}

.lists{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:14px}
.list{display:flex;flex-direction:column;gap:2px;padding:0 8px}

.item{
  display:flex;align-items:center;gap:12px;padding:10px 11px;border-radius:14px;
  cursor:pointer;transition:.15s;position:relative;
}
.item:hover{background:var(--panel-2)}
.item.active{background:linear-gradient(90deg,rgba(109,92,255,.20),rgba(109,92,255,.05))}
.item.active::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:24px;border-radius:0 3px 3px 0;background:var(--accent-grad);
}
.item.static{cursor:default}
.item.static:hover{background:var(--panel-2)}

.avatar{
  width:46px;height:46px;border-radius:15px;flex:0 0 auto;position:relative;
  display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);letter-spacing:.4px;
}
.avatar.sm{width:34px;height:34px;border-radius:11px;font-size:12.5px}
.avatar.xl{width:96px;height:96px;border-radius:32px;font-size:32px;margin:0 auto}
.avatar .dot{
  position:absolute;right:-2px;bottom:-2px;width:13px;height:13px;border-radius:50%;
  background:var(--muted-2);border:3px solid var(--panel);
}
.avatar .dot.on{background:var(--green);box-shadow:0 0 10px rgba(46,224,138,.8)}
.item.active .avatar .dot{border-color:#171b28}

.item-body{flex:1;min-width:0}
.item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item-name{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-time{font-size:11px;color:var(--muted-2);flex:0 0 auto}
.item-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:3px}
.item-last{
  font-size:12.8px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.unread{
  background:var(--accent-grad);color:#fff;font-size:11px;font-weight:700;
  min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;
  box-shadow:0 4px 12px rgba(109,92,255,.45);
}
.badge{
  background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;
}
.mini-btn{
  padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:600;transition:.16s;flex:0 0 auto;
}
.mini-btn.primary{background:var(--accent-grad);color:#fff;box-shadow:0 5px 16px rgba(109,92,255,.34)}
.mini-btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(109,92,255,.45)}
.mini-btn.ghost{background:var(--panel-3);color:var(--muted);border:1px solid var(--line-2)}
.mini-btn.ghost:hover{color:var(--text)}
.mini-btn.danger{background:rgba(255,77,109,.14);color:var(--red)}
.mini-btn.danger:hover{background:rgba(255,77,109,.24)}
.mini-btn:disabled{opacity:.55;cursor:default;transform:none!important}

.section-title{
  font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--muted-2);padding:14px 14px 7px;
}
.empty-note{
  color:var(--muted-2);font-size:13px;text-align:center;padding:30px 22px;line-height:1.65;
}

/* ============ CHAT ============ */
.chat{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;background:rgba(8,10,16,.4)}
.chat-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
}
.brand-ghost{
  font-size:76px;font-weight:800;letter-spacing:-4px;
  background:linear-gradient(135deg,rgba(109,92,255,.20),rgba(168,85,247,.08));
  -webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;
}
.chat-empty p{color:var(--muted-2);font-size:14px;max-width:300px;line-height:1.65}

.chat-view{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{
  display:flex;align-items:center;gap:13px;padding:13px 18px;
  border-bottom:1px solid var(--line);
  background:rgba(13,15,23,.72);backdrop-filter:blur(18px);z-index:5;
}
.chat-title{flex:1;min-width:0}
.chat-title .name{font-size:16px;font-weight:700;letter-spacing:-.2px}
.chat-title .status{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.chat-title .status.on{color:var(--green)}
.chat-actions{display:flex;gap:5px}
.icon-btn.back{display:none}

.messages{
  flex:1;overflow-y:auto;padding:22px 22px 10px;display:flex;flex-direction:column;gap:3px;
}
.day-sep{
  align-self:center;font-size:11.5px;font-weight:600;color:var(--muted-2);
  background:var(--panel-2);border:1px solid var(--line);
  padding:5px 14px;border-radius:20px;margin:16px 0 10px;
}
.msg{display:flex;gap:9px;max-width:74%;animation:msgIn .24s ease-out;margin-top:3px}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .avatar{width:32px;height:32px;border-radius:11px;font-size:11.5px;align-self:flex-end}
.bubble{
  background:var(--panel-3);border:1px solid var(--line);
  padding:10px 14px;border-radius:17px 17px 17px 5px;
  font-size:14.4px;line-height:1.5;word-break:break-word;white-space:pre-wrap;
  position:relative;
}
.msg.me .bubble{
  background:var(--accent-grad);border-color:transparent;color:#fff;
  border-radius:17px 17px 5px 17px;
  box-shadow:0 8px 24px rgba(109,92,255,.28);
}
.bubble .meta{
  font-size:10.5px;color:var(--muted-2);margin-top:5px;text-align:right;
  display:flex;align-items:center;justify-content:flex-end;gap:5px;
}
.msg.me .bubble .meta{color:rgba(255,255,255,.72)}
.bubble .meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.msg.call-log{align-self:center;max-width:100%}
.msg.call-log .bubble{
  background:var(--panel-2);border:1px dashed var(--line-2);color:var(--muted);
  border-radius:14px;font-size:12.8px;display:flex;align-items:center;gap:8px;padding:8px 16px;
}
.msg.call-log .bubble svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.composer{
  display:flex;gap:11px;align-items:center;padding:14px 18px 18px;
  border-top:1px solid var(--line);background:rgba(13,15,23,.72);backdrop-filter:blur(18px);
}
.composer input{
  flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:15px;
  padding:13px 18px;font-size:14.5px;transition:.2s;
}
.composer input::placeholder{color:var(--muted-2)}
.composer input:focus{border-color:rgba(109,92,255,.6);background:#141828;box-shadow:0 0 0 4px rgba(109,92,255,.1)}
.send-btn{
  width:48px;height:48px;border-radius:15px;background:var(--accent-grad);
  display:grid;place-items:center;flex:0 0 auto;transition:.18s;
  box-shadow:0 8px 24px rgba(109,92,255,.36);
}
.send-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 30px rgba(109,92,255,.5)}
.send-btn:active{transform:scale(.96)}
.send-btn svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ CALL ============ */
.call-overlay{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  background:rgba(4,5,9,.82);backdrop-filter:blur(26px);
  animation:fadeIn .25s;
}
@keyframes fadeIn{from{opacity:0}}
.call-box{
  position:relative;width:min(560px,92vw);height:min(660px,86vh);
  border-radius:30px;overflow:hidden;
  background:linear-gradient(180deg,#151928,#0b0d15);
  border:1px solid var(--line-2);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;
  animation:pop .35s cubic-bezier(.2,.9,.3,1.25);
}
#remoteVideo{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#05060a;
}
.call-info{
  position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex:1;width:100%;gap:18px;padding:40px 24px;
  transition:.3s;
}
.call-box.has-video .call-info{
  position:absolute;top:0;left:0;right:0;flex:none;padding:22px;
  background:linear-gradient(180deg,rgba(0,0,0,.65),transparent);
  flex-direction:row;justify-content:flex-start;gap:12px;align-items:center;
}
.call-box.has-video .call-info .avatar{width:44px;height:44px;border-radius:14px;font-size:15px;margin:0}
.call-box.has-video .call-info .call-name{font-size:16px}
.call-box.has-video .call-info .call-status{font-size:12.5px;margin-top:1px}
.call-box.has-video #localVideo{
  position:absolute;right:18px;bottom:112px;width:118px;height:158px;border-radius:18px;
  object-fit:cover;z-index:6;border:2px solid rgba(255,255,255,.14);
  box-shadow:0 12px 30px rgba(0,0,0,.6);background:#05060a;transform:scaleX(-1);
}
#localVideo{
  position:absolute;right:18px;bottom:112px;width:0;height:0;opacity:0;pointer-events:none;
}
.call-box.video-on #localVideo{opacity:1}
.call-name{font-size:26px;font-weight:700;letter-spacing:-.5px;text-align:center}
.call-status{font-size:14px;color:var(--muted);text-align:center;letter-spacing:.3px}
.call-status.pulse{animation:pulseTxt 1.6s ease-in-out infinite}
@keyframes pulseTxt{0%,100%{opacity:.55}50%{opacity:1}}

.call-controls{
  position:relative;z-index:4;display:flex;gap:14px;padding:0 24px 34px;align-items:center;
}
.call-box.has-video .call-controls{padding-bottom:30px}
.cbtn{
  width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.10);
  backdrop-filter:blur(12px);transition:.18s;color:#fff;
}
.cbtn:hover{background:rgba(255,255,255,.17);transform:translateY(-2px)}
.cbtn:active{transform:scale(.94)}
.cbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cbtn.hangup{background:linear-gradient(135deg,#ff4d6d,#e0245e);border-color:transparent;box-shadow:0 10px 26px rgba(255,77,109,.42)}
.cbtn.hangup:hover{box-shadow:0 14px 32px rgba(255,77,109,.55)}
.cbtn.accept{background:linear-gradient(135deg,#2ee08a,#16a765);border-color:transparent;box-shadow:0 10px 26px rgba(46,224,138,.4);animation:ringPulse 1.6s infinite}
@keyframes ringPulse{0%,100%{box-shadow:0 10px 26px rgba(46,224,138,.4)}50%{box-shadow:0 10px 34px rgba(46,224,138,.75)}}
.cbtn.off{background:rgba(255,255,255,.92);color:#0b0d15}
.cbtn.off svg{stroke:#0b0d15}

/* ============ TOAST ============ */
.toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none}
.toast{
  background:rgba(24,28,41,.96);border:1px solid var(--line-2);color:var(--text);
  padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:500;
  box-shadow:0 16px 44px rgba(0,0,0,.6);backdrop-filter:blur(14px);
  animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes toastIn{from{opacity:0;transform:translateY(16px)}}

/* ============ RESPONSIVE ============ */
@media (max-width:820px){
  .sidebar{width:100%;flex:1 1 100%}
  .chat{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
  .app.chat-open .chat{transform:translateX(0)}
  .app.chat-open .sidebar{visibility:hidden}
  .icon-btn.back{display:grid}
  .messages{padding:16px 14px 8px}
  .msg{max-width:86%}
  .composer{padding:12px 12px 16px}
  .call-box{height:88vh;border-radius:24px}
}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="brand-lg">Mast</div>
    <div class="auth-tagline">Общайся. Звони. Будь на связи.</div>

    <div class="seg">
      <button class="seg-btn active" data-mode="login" type="button">Вход</button>
      <button class="seg-btn" data-mode="register" type="button">Регистрация</button>
    </div>

    <form id="authForm" autocomplete="off">
      <div class="field">
        <label>Имя пользователя</label>
        <div class="input-wrap">
          <span class="at">@</span>
          <input id="authUser" placeholder="username" autocomplete="off" spellcheck="false" maxlength="20">
        </div>
      </div>
      <div class="field">
        <label>Пароль</label>
        <div class="input-wrap">
          <input id="authPass" type="password" placeholder="••••••••" autocomplete="off" maxlength="64">
        </div>
      </div>
      <div class="auth-msg" id="authMsg"></div>
      <button class="btn-primary" id="authSubmit" type="submit">Войти</button>
    </form>

    <div class="auth-foot">Аккаунт хранится локально в вашем браузере.<br>Откройте вторую вкладку, чтобы войти другим пользователем.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-top">
      <div class="brand">Mast</div>
      <div style="display:flex;align-items:center;gap:2px">
        <div class="me" id="meBtn">
          <div class="avatar sm" id="meAvatar"></div>
          <div class="me-name" id="meName"></div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Выйти">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" placeholder="Поиск людей по @username" autocomplete="off" spellcheck="false">
    </div>

    <div class="seg small">
      <button class="seg-btn active" data-tab="chats" type="button">Чаты</button>
      <button class="seg-btn" data-tab="friends" type="button">Друзья <span class="badge hidden" id="reqBadge"></span></button>
    </div>

    <div class="lists">
      <div class="list" id="listChats"></div>
      <div class="list hidden" id="listFriends"></div>
      <div class="list hidden" id="listSearch"></div>
    </div>
  </aside>

  <main class="chat">
    <div class="chat-empty" id="chatEmpty">
      <div class="brand-ghost">Mast</div>
      <p>Выберите чат из списка или найдите друга по <b>@username</b>, чтобы начать общение</p>
    </div>

    <div class="chat-view hidden" id="chatView">
      <header class="chat-head">
        <button class="icon-btn back" id="backBtn">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="avatar" id="chatAvatar"></div>
        <div class="chat-title">
          <div class="name" id="chatName"></div>
          <div class="status" id="chatStatus"></div>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" id="btnAudio" title="Аудиозвонок">
            <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/></svg>
          </button>
          <button class="icon-btn" id="btnVideo" title="Видеозвонок">
            <svg viewBox="0 0 24 24"><path d="m23 7-7 5 7 5V7Z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          </button>
          <button class="icon-btn danger" id="btnUnfriend" title="Удалить из друзей">
            <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <form class="composer" id="composer" autocomplete="off">
        <input id="msgInput" placeholder="Написать сообщение..." autocomplete="off" maxlength="2000">
        <button class="send-btn" type="submit" title="Отправить">
          <svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </form>
    </div>
  </main>
</div>

<!-- ================= CALL ================= -->
<div class="call-overlay hidden" id="callOverlay">
  <div class="call-box" id="callBox">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>

    <div class="call-info">
      <div class="avatar xl" id="callAvatar"></div>
      <div>
        <div class="call-name" id="callName"></div>
        <div class="call-status" id="callStatus"></div>
      </div>
    </div>

    <div class="call-controls">
      <button class="cbtn" id="btnMute" title="Микрофон">
        <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
      </button>
      <button class="cbtn" id="btnCam" title="Камера">
        <svg viewBox="0 0 24 24"><path d="m23 7-7 5 7 5V7Z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="cbtn accept hidden" id="btnAccept" title="Принять">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/></svg>
      </button>
      <button class="cbtn hangup" id="btnHangup" title="Завершить">
        <svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* ==================================================================
   MAST — мессенджер (локальная версия)
   ================================================================== */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS = {
  users:    'mast_users',
  friends:  'mast_friends',
  reqs:     'mast_requests',
  msgs:     'mast_messages',
  presence: 'mast_presence'
};
const SS_SESSION = 'mast_session';

const db = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};

/* ---------- пароль (демо-хеш, не для продакшена) ---------- */
function hash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

/* ---------- аватары ---------- */
function avColors(u) {
  let h = 0;
  for (const c of u) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = h % 360, b = (a + 48) % 360;
  return [`hsl(${a} 72% 58%)`, `hsl(${b} 74% 44%)`];
}
function avatarHTML(u, cls = '', showDot = false, online = false) {
  const [c1, c2] = avColors(u);
  return `<div class="avatar ${cls}" style="--c1:${c1};--c2:${c2}">${esc(u.slice(0, 2).toUpperCase())}` +
    (showDot ? `<span class="dot ${online ? 'on' : ''}"></span>` : '') + `</div>`;
}

/* ---------- время ---------- */
const pad = n => String(n).padStart(2, '0');
function fmtTime(ts) { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtDay(ts) {
  const d = new Date(ts), t = new Date();
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, t)) return 'Сегодня';
  const y = new Date(t); y.setDate(y.getDate() - 1);
  if (same(d, y)) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}
function fmtDur(sec) { return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; }
function fmtLastSeen(u) {
  const p = db.get(LS.presence, {})[u];
  if (!p) return 'не в сети';
  const diff = Date.now() - p;
  if (diff < 9000) return 'в сети';
  if (diff < 60000) return 'был(а) недавно';
  return 'был(а) ' + fmtTime(p);
}

/* ---------- данные ---------- */
const getUsers   = () => db.get(LS.users, {});
const saveUsers  = u => db.set(LS.users, u);
const getFriends = () => db.get(LS.friends, {});
const getReqs    = () => db.get(LS.reqs, {});

function friendsOf(u) { return getFriends()[u] || []; }
function reqsOf(u)    { return getReqs()[u] || []; }

function addFriend(a, b) {
  const f = getFriends();
  f[a] = [...new Set([...(f[a] || []), b])];
  f[b] = [...new Set([...(f[b] || []), a])];
  db.set(LS.friends, f);
}
function removeFriend(a, b) {
  const f = getFriends();
  f[a] = (f[a] || []).filter(x => x !== b);
  f[b] = (f[b] || []).filter(x => x !== a);
  db.set(LS.friends, f);
  const r = getReqs();
  r[a] = (r[a] || []).filter(x => x.from !== b);
  r[b] = (r[b] || []).filter(x => x.from !== a);
  db.set(LS.reqs, r);
}
function sendRequest(from, to) {
  const r = getReqs();
  r[to] = [...(r[to] || []).filter(x => x.from !== from), { from, at: Date.now() }];
  db.set(LS.reqs, r);
}
function dropRequest(owner, from) {
  const r = getReqs();
  r[owner] = (r[owner] || []).filter(x => x.from !== from);
  db.set(LS.reqs, r);
}

const chatKey = (a, b) => [a, b].sort().join('::');
function getMsgs(a, b) { return db.get(LS.msgs, {})[chatKey(a, b)] || []; }
function pushMsg(a, b, msg) {
  const all = db.get(LS.msgs, {});
  const k = chatKey(a, b);
  all[k] = [...(all[k] || []), msg];
  db.set(LS.msgs, all);
}
function allConversations() { return db.get(LS.msgs, {}); }

/* ---------- presence ---------- */
function heartbeat() {
  if (!state.me) return;
  const p = db.get(LS.presence, {});
  p[state.me] = Date.now();
  db.set(LS.presence, p);
}
function isOnline(u) {
  const p = db.get(LS.presence, {})[u];
  return !!p && Date.now() - p < 9000;
}

/* ---------- шина событий между вкладками ---------- */
const bus = ('BroadcastChannel' in window) ? new BroadcastChannel('mast_bus') : null;
function emit(type, payload = {}) { if (bus) bus.postMessage({ type, payload, from: state.me }); }

/* ---------- состояние ---------- */
const state = {
  me: null,
  tab: 'chats',
  chatWith: null,
  query: ''
};

/* ---------- тосты ---------- */
function toast(text, ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; }, ms - 300);
  setTimeout(() => el.remove(), ms);
}

/* ==================================================================
   АВТОРИЗАЦИЯ
   ================================================================== */
let authMode = 'login';

$$('.seg-btn[data-mode]').forEach(b => {
  b.addEventListener('click', () => {
    authMode = b.dataset.mode;
    $$('.seg-btn[data-mode]').forEach(x => x.classList.toggle('active', x === b));
    $('#authSubmit').textContent = authMode === 'login' ? 'Войти' : 'Создать аккаунт';
    setAuthMsg('');
  });
});

function setAuthMsg(t, ok = false) {
  const el = $('#authMsg');
  el.textContent = t;
  el.classList.toggle('show', !!t);
  el.classList.toggle('ok', ok);
}

$('#authForm').addEventListener('submit', e => {
  e.preventDefault();
  const username = $('#authUser').value.trim().toLowerCase().replace(/^@/, '');
  const pass = $('#authPass').value;

  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    return setAuthMsg('Username: 3–20 символов, только латиница, цифры и _');
  }
  if (pass.length < 4) return setAuthMsg('Пароль должен быть не короче 4 символов');

  const users = getUsers();

  if (authMode === 'register') {
    if (users[username]) return setAuthMsg('Этот username уже занят');
    const salt = uid();
    users[username] = { username, salt, pass: hash(salt + pass), createdAt: Date.now() };
    saveUsers(users);
    setAuthMsg('Аккаунт создан! Входим…', true);
    setTimeout(() => login(username), 320);
  } else {
    const u = users[username];
    if (!u) return setAuthMsg('Пользователь не найден');
    if (u.pass !== hash(u.salt + pass)) return setAuthMsg('Неверный пароль');
    setAuthMsg('Добро пожаловать!', true);
    setTimeout(() => login(username), 260);
  }
});

function login(username) {
  sessionStorage.setItem(SS_SESSION, username);
  state.me = username;
  heartbeat();
  startApp();
}

$('#logoutBtn').addEventListener('click', () => {
  const p = db.get(LS.presence, {});
  delete p[state.me];
  db.set(LS.presence, p);
  sessionStorage.removeItem(SS_SESSION);
  location.reload();
});

/* ==================================================================
   СТАРТ ПРИЛОЖЕНИЯ
   ================================================================== */
function startApp() {
  $('#authScreen').classList.add('hidden');
  $('#app').classList.add('on');
  $('#meAvatar').outerHTML = avatarHTML(state.me, 'sm').replace('class="avatar sm"', 'class="avatar sm" id="meAvatar"');
  $('#meName').textContent = '@' + state.me;
  renderAll();
  requestAnimationFrame(() => $('#msgInput')?.focus());
}

function renderAll() {
  if (!state.me) return;
  renderBadge();
  renderChats();
  renderFriends();
  renderSearch();
  renderHeaderStatus();
  if (state.chatWith) renderMessages();
}

/* ---------- бейдж заявок ---------- */
function renderBadge() {
  const n = reqsOf(state.me).length;
  const b = $('#reqBadge');
  b.textContent = n;
  b.classList.toggle('hidden', n === 0);
}

/* ---------- список чатов ---------- */
function conversationPartners() {
  const set = new Set(friendsOf(state.me));
  Object.keys(allConversations()).forEach(k => {
    const [a, b] = k.split('::');
    if (a === state.me) set.add(b);
    if (b === state.me) set.add(a);
  });
  set.delete(state.me);
  return [...set].filter(u => getUsers()[u]);
}

function lastMessageWith(u) {
  const m = getMsgs(state.me, u);
  return m.length ? m[m.length - 1] : null;
}
function unreadCount(u) {
  return getMsgs(state.me, u).filter(m => m.to === state.me && !m.read).length;
}

function renderChats() {
  const el = $('#listChats');
  const partners = conversationPartners()
    .map(u => ({ u, last: lastMessageWith(u) }))
    .sort((a, b) => (b.last?.at || 0) - (a.last?.at || 0));

  if (!partners.length) {
    el.innerHTML = `<div class="empty-note">Пока нет чатов.<br>Найдите друга по <b>@username</b> в поиске выше<br>и отправьте заявку в друзья.</div>`;
    return;
  }

  el.innerHTML = partners.map(({ u, last }) => {
    const un = unreadCount(u);
    let preview = 'Нет сообщений';
    if (last) {
      if (last.kind === 'call') preview = (last.from === state.me ? '↗ ' : '↙ ') + last.text;
      else preview = (last.from === state.me ? 'Вы: ' : '') + last.text;
    }
    return `
      <div class="item ${state.chatWith === u ? 'active' : ''}" data-user="${esc(u)}">
        ${avatarHTML(u, '', true, isOnline(u))}
        <div class="item-body">
          <div class="item-top">
            <span class="item-name">@${esc(u)}</span>
            ${last ? `<span class="item-time">${fmtTime(last.at)}</span>` : ''}
          </div>
          <div class="item-bottom">
            <span class="item-last">${esc(preview).slice(0, 70)}</span>
            ${un ? `<span class="unread">${un}</span>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

/* ---------- список друзей ---------- */
function renderFriends() {
  const el = $('#listFriends');
  const reqs = reqsOf(state.me).filter(r => getUsers()[r.from]);
  const friends = friendsOf(state.me).filter(u => getUsers()[u])
    .sort((a, b) => (isOnline(b) ? 1 : 0) - (isOnline(a) ? 1 : 0) || a.localeCompare(b));

  let html = '';

  if (reqs.length) {
    html += `<div class="section-title">Заявки в друзья · ${reqs.length}</div>`;
    html += reqs.map(r => `
      <div class="item static">
        ${avatarHTML(r.from)}
        <div class="item-body">
          <div class="item-top"><span class="item-name">@${esc(r.from)}</span></div>
          <div class="item-bottom"><span class="item-last">Хочет добавить вас в друзья</span></div>
        </div>
        <button class="mini-btn primary" data-act="accept" data-user="${esc(r.from)}">Принять</button>
        <button class="mini-btn danger" data-act="reject" data-user="${esc(r.from)}">✕</button>
      </div>`).join('');
  }

  html += `<div class="section-title">Мои друзья · ${friends.length}</div>`;

  if (!friends.length) {
    html += `<div class="empty-note">Список друзей пуст.<br>Найдите людей через поиск.</div>`;
  } else {
    html += friends.map(u => `
      <div class="item" data-user="${esc(u)}" data-open="chat">
        ${avatarHTML(u, '', true, isOnline(u))}
        <div class="item-body">
          <div class="item-top"><span class="item-name">@${esc(u)}</span></div>
          <div class="item-bottom"><span class="item-last">${isOnline(u) ? 'в сети' : fmtLastSeen(u)}</span></div>
        </div>
        <button class="mini-btn ghost" data-act="unfriend" data-user="${esc(u)}">Удалить</button>
      </div>`).join('');
  }

  el.innerHTML = html;
}

/* ---------- поиск ---------- */
function renderSearch() {
  const el = $('#listSearch');
  const q = state.query.trim().toLowerCase().replace(/^@/, '');
  if (!q) { el.innerHTML = ''; return; }

  const users = Object.keys(getUsers()).filter(u => u !== state.me && u.includes(q)).slice(0, 40);

  if (!users.length) {
    el.innerHTML = `<div class="empty-note">Никого не найдено по запросу «${esc(q)}»</div>`;
    return;
  }

  el.innerHTML = users.map(u => {
    const friend = friendsOf(state.me).includes(u);
    const outgoing = reqsOf(u).some(r => r.from === state.me);
    const incoming = reqsOf(state.me).some(r => r.from === u);
    let btn = '';
    if (friend)        btn = `<button class="mini-btn ghost" disabled>В друзьях</button>`;
    else if (incoming) btn = `<button class="mini-btn primary" data-act="accept" data-user="${esc(u)}">Принять</button>`;
    else if (outgoing) btn = `<button class="mini-btn ghost" disabled>Заявка отправлена</button>`;
    else               btn = `<button class="mini-btn primary" data-act="add" data-user="${esc(u)}">Добавить</button>`;

    return `
      <div class="item static">
        ${avatarHTML(u, '', true, isOnline(u))}
        <div class="item-body">
          <div class="item-top"><span class="item-name">@${esc(u)}</span></div>
          <div class="item-bottom"><span class="item-last">${fmtLastSeen(u)}</span></div>
        </div>
        ${btn}
      </div>`;
  }).join('');
}

/* ---------- заголовок чата ---------- */
function renderHeaderStatus() {
  if (!state.chatWith) return;
  const u = state.chatWith;
  const el = $('#chatStatus');
  const on = isOnline(u);
  el.textContent = on ? 'в сети' : fmtLastSeen(u);
  el.classList.toggle('on', on);
}

/* ==================================================================
   ОТКРЫТИЕ ЧАТА И СООБЩЕНИЯ
   ================================================================== */
function openChat(u) {
  state.chatWith = u;
  $('#chatEmpty').classList.add('hidden');
  $('#chatView').classList.remove('hidden');
  $('#app').classList.add('chat-open');

  const [c1, c2] = avColors(u);
  const av = $('#chatAvatar');
  av.style.setProperty('--c1', c1);
  av.style.setProperty('--c2', c2);
  av.textContent = u.slice(0, 2).toUpperCase();

  $('#chatName').textContent = '@' + u;
  renderHeaderStatus();
  markRead(u);
  renderMessages();
  renderChats();
  renderFriends();
  setTimeout(() => $('#msgInput')?.focus(), 50);
}

function closeChat() {
  state.chatWith = null;
  $('#chatView').classList.add('hidden');
  $('#chatEmpty').classList.remove('hidden');
  $('#app').classList.remove('chat-open');
  renderChats();
}

function markRead(peer) {
  const all = db.get(LS.msgs, {});
  const k = chatKey(state.me, peer);
  let changed = false;
  (all[k] || []).forEach(m => { if (m.to === state.me && !m.read) { m.read = true; changed = true; } });
  if (changed) { db.set(LS.msgs, all); emit('update'); }
}

function renderMessages() {
  const u = state.chatWith;
  if (!u) return;
  const box = $('#messages');
  const msgs = getMsgs(state.me, u);

  if (!msgs.length) {
    box.innerHTML = `<div class="empty-note" style="margin:auto">Начните переписку с <b>@${esc(u)}</b> 👋</div>`;
    return;
  }

  let html = '';
  let lastDay = '';

  for (const m of msgs) {
    const day = fmtDay(m.at);
    if (day !== lastDay) {
      html += `<div class="day-sep">${day}</div>`;
      lastDay = day;
    }

    if (m.kind === 'call') {
      html += `<div class="msg call-log"><div class="bubble">
        <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2Z"/></svg>
        ${esc(m.text)} · ${fmtTime(m.at)}</div></div>`;
      continue;
    }

    const mine = m.from === state.me;
    const [c1, c2] = avColors(m.from);
    const tick = mine
      ? `<svg viewBox="0 0 24 24"><path d="m1 13 4 4L15 7"/><path d="m9 13 4 4L23 7"/></svg>`
      : '';

    html += `
      <div class="msg ${mine ? 'me' : ''}">
        ${mine ? '' : `<div class="avatar" style="--c1:${c1};--c2:${c2}">${esc(m.from.slice(0,2).toUpperCase())}</div>`}
        <div class="bubble">${esc(m.text)}<div class="meta">${fmtTime(m.at)}${tick}</div></div>
      </div>`;
  }

  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#msgInput');
  const text = input.value.trim();
  if (!text || !state.chatWith) return;

  const msg = { id: uid(), from: state.me, to: state.chatWith, text, at: Date.now(), read: false, kind: 'text' };
  pushMsg(state.me, state.chatWith, msg);
  input.value = '';
  renderMessages();
  renderChats();
  emit('update', { to: state.chatWith });
  emit('notify', { to: state.chatWith });
});

/* ==================================================================
   ДЕЙСТВИЯ В СПИСКАХ
   ================================================================== */
document.addEventListener('click', e => {
  const actBtn = e.target.closest('[data-act]');
  if (actBtn) {
    e.stopPropagation();
    const u = actBtn.dataset.user;
    const act = actBtn.dataset.act;

    if (act === 'add') {
      sendRequest(state.me, u);
      toast('Заявка отправлена @' + u);
      emit('update', { to: u });
      renderAll();
    }
    if (act === 'accept') {
      dropRequest(state.me, u);
      addFriend(state.me, u);
      toast('@' + u + ' теперь у вас в друзьях');
      emit('update', { to: u });
      renderAll();
    }
    if (act === 'reject') {
      dropRequest(state.me, u);
      emit('update', { to: u });
      renderAll();
    }
    if (act === 'unfriend') {
      removeFriend(state.me, u);
      toast('@' + u + ' удалён из друзей');
      emit('update', { to: u });
      if (state.chatWith === u) closeChat();
      renderAll();
    }
    return;
  }

  const item = e.target.closest('.item');
  if (item && item.dataset.user && !item.classList.contains('static')) {
    openChat(item.dataset.user);
  }
});

/* ---------- табы ---------- */
$$('.seg-btn[data-tab]').forEach(b => {
  b.addEventListener('click', () => {
    state.tab = b.dataset.tab;
    state.query = '';
    $('#searchInput').value = '';
    $$('.seg-btn[data-tab]').forEach(x => x.classList.toggle('active', x === b));
    $('#listChats').classList.toggle('hidden', state.tab !== 'chats');
    $('#listFriends').classList.toggle('hidden', state.tab !== 'friends');
    $('#listSearch').classList.add('hidden');
  });
});

/* ---------- поиск ---------- */
$('#searchInput').addEventListener('input', e => {
  state.query = e.target.value;
  const has = state.query.trim().length > 0;
  $('#listChats').classList.toggle('hidden', has || state.tab !== 'chats');
  $('#listFriends').classList.toggle('hidden', has || state.tab !== 'friends');
  $('#listSearch').classList.toggle('hidden', !has);
  if (has) renderSearch();
});

/* ---------- кнопки чата ---------- */
$('#backBtn').addEventListener('click', closeChat);
$('#btnAudio').addEventListener('click', () => startCall(state.chatWith, false));
$('#btnVideo').addEventListener('click', () => startCall(state.chatWith, true));
$('#btnUnfriend').addEventListener('click', () => {
  if (!state.chatWith) return;
  if (confirm('Удалить @' + state.chatWith + ' из друзей?')) {
    removeFriend(state.me, state.chatWith);
    emit('update', { to: state.chatWith });
    closeChat();
    renderAll();
  }
});

/* ==================================================================
   ЗВОНКИ (WebRTC + BroadcastChannel)
   ================================================================== */
const call = {
  active: false, incoming: false, role: null, peer: null, video: false,
  pc: null, localStream: null, remoteStream: null,
  pendingOffer: null, pendingCandidates: [],
  timeout: null, timer: null, connectedAt: 0
};

function setCallStatus(t, pulse = false) {
  const el = $('#callStatus');
  el.textContent = t;
  el.classList.toggle('pulse', pulse);
}

function showCallUI(peer, video) {
  const [c1, c2] = avColors(peer);
  const av = $('#callAvatar');
  av.style.setProperty('--c1', c1);
  av.style.setProperty('--c2', c2);
  av.textContent = peer.slice(0, 2).toUpperCase();
  $('#callName').textContent = '@' + peer;
  $('#callBox').classList.toggle('has-video', false);
  $('#callBox').classList.toggle('video-on', false);
  $('#remoteVideo').classList.add('hidden');
  $('#localVideo').srcObject = null;
  $('#callOverlay').classList.remove('hidden');
}

function hideCallUI() {
  $('#callOverlay').classList.add('hidden');
  $('#remoteVideo').srcObject = null;
  $('#localVideo').srcObject = null;
  $('#remoteVideo').classList.remove('hidden');
  $('#btnAccept').classList.add('hidden');
  $('#btnCam').classList.remove('off');
  $('#btnMute').classList.remove('off');
}

function createPC() {
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }]
  });
  call.pc = pc;

  const tracks = call.localStream ? call.localStream.getTracks() : [];
  if (tracks.length) {
    tracks.forEach(t => pc.addTrack(t, call.localStream));
  } else {
    pc.addTransceiver('audio', { direction: 'recvonly' });
    if (call.video) pc.addTransceiver('video', { direction: 'recvonly' });
  }

  pc.ontrack = e => {
    call.remoteStream = e.streams[0];
    const rv = $('#remoteVideo');
    rv.srcObject = e.streams[0];
    rv.play().catch(() => {});
    if (call.video) {
      $('#callBox').classList.add('has-video');
      rv.classList.remove('hidden');
    }
  };

  pc.onicecandidate = e => {
    if (e.candidate) emit('call-ice', { to: call.peer, candidate: e.candidate });
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') onCallConnected();
    if (s === 'failed') endCall('Ошибка соединения');
  };
}

function onCallConnected() {
  if (call.connectedAt) return;
  call.connectedAt = Date.now();
  clearTimeout(call.timeout);
  setCallStatus('00:00');
  clearInterval(call.timer);
  call.timer = setInterval(() => {
    setCallStatus(fmtDur(Math.round((Date.now() - call.connectedAt) / 1000)));
  }, 1000);
  if (call.video) {
    $('#callBox').classList.add('has-video');
    $('#remoteVideo').classList.remove('hidden');
  }
}

function attachLocal() {
  const lv = $('#localVideo');
  lv.srcObject = call.localStream;
  const hasVideo = call.localStream && call.localStream.getVideoTracks().length > 0;
  $('#callBox').classList.toggle('video-on', hasVideo);
}

async function getMedia(video) {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: true, video });
  } catch (e) {
    toast('Нет доступа к микрофону/камере — звонок без медиа');
    return new MediaStream();
  }
}

/* ---------- исходящий ---------- */
async function startCall(peer, video) {
  if (!peer) return;
  if (call.active) return toast('Уже идёт звонок');

  if (!isOnline(peer)) {
    toast('@' + peer + ' не в сети. Позвонить можно только когда у него открыт Mast.');
    return;
  }

  call.active = true;
  call.incoming = false;
  call.role = 'caller';
  call.peer = peer;
  call.video = video;
  call.connectedAt = 0;
  call.pendingCandidates = [];

  showCallUI(peer, video);
  $('#btnAccept').classList.add('hidden');
  setCallStatus(video ? 'Видеозвонок…' : 'Вызов…', true);

  call.localStream = await getMedia(video);
  attachLocal();
  createPC();

  const offer = await call.pc.createOffer();
  await call.pc.setLocalDescription(offer);
  emit('call-offer', { to: peer, sdp: call.pc.localDescription, video });

  clearTimeout(call.timeout);
  call.timeout = setTimeout(() => {
    if (call.active && !call.connectedAt) endCall('Нет ответа');
  }, 32000);
}

/* ---------- входящий ---------- */
function showIncoming(peer, video) {
  showCallUI(peer, video);
  $('#btnAccept').classList.remove('hidden');
  $('#btnAccept').dataset.video = video ? '1' : '0';
  setCallStatus(video ? 'Входящий видеозвонок' : 'Входящий звонок', true);
  playRing();
}

let ringCtx = null, ringTimer = null;
function playRing() {
  stopRing();
  try {
    ringCtx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = () => {
      const o = ringCtx.createOscillator(), g = ringCtx.createGain();
      o.connect(g); g.connect(ringCtx.destination);
      o.frequency.value = 620; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ringCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.09, ringCtx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, ringCtx.currentTime + 0.5);
      o.start(); o.stop(ringCtx.currentTime + 0.55);
    };
    beep();
    ringTimer = setInterval(beep, 1600);
  } catch {}
}
function stopRing() {
  clearInterval(ringTimer); ringTimer = null;
  try { ringCtx && ringCtx.close(); } catch {}
  ringCtx = null;
}

async function acceptCall() {
  if (!call.pendingOffer) return;
  stopRing();
  $('#btnAccept').classList.add('hidden');
  call.incoming = false;
  call.connectedAt = 0;
  setCallStatus('Соединение…', true);

  call.localStream = await getMedia(call.video);
  attachLocal();
  createPC();

  try {
    await call.pc.setRemoteDescription(call.pendingOffer.sdp);
    for (const c of call.pendingCandidates) { try { await call.pc.addIceCandidate(c); } catch {} }
    call.pendingCandidates = [];
    const answer = await call.pc.createAnswer();
    await call.pc.setLocalDescription(answer);
    emit('call-answer', { to: call.peer, sdp: call.pc.localDescription });
  } catch (e) {
    endCall('Ошибка соединения');
  }
}

/* ---------- завершение ---------- */
function endCall(reason) {
  if (!call.active && !call.pc) { hideCallUI(); return; }

  const peer = call.peer;
  const role = call.role;
  const video = call.video;
  const connected = !!call.connectedAt;
  const dur = connected ? Math.round((Date.now() - call.connectedAt) / 1000) : 0;

  stopRing();
  clearTimeout(call.timeout);
  clearInterval(call.timer);

  if (peer) emit('call-end', { to: peer });

  if (call.pc) { try { call.pc.close(); } catch {} }
  if (call.localStream) call.localStream.getTracks().forEach(t => { try { t.stop(); } catch {} });

  Object.assign(call, {
    active: false, incoming: false, role: null, peer: null, video: false,
    pc: null, localStream: null, remoteStream: null,
    pendingOffer: null, pendingCandidates: [],
    timeout: null, timer: null, connectedAt: 0
  });

  hideCallUI();

  if (peer) {
    let text;
    if (connected) text = (video ? 'Видеозвонок' : 'Звонок') + ' · ' + fmtDur(dur);
    else if (role === 'caller') text = 'Исходящий звонок · ' + (reason || 'нет ответа');
    else text = reason === 'Занято' ? 'Звонок · занято' : 'Пропущенный звонок';

    const msg = { id: uid(), from: state.me, to: peer, kind: 'call', text, at: Date.now(), read: true };
    pushMsg(state.me, peer, msg);
    emit('update', { to: peer });
    renderAll();
  }

  if (reason) toast(reason);
}

$('#btnHangup').addEventListener('click', () => {
  if (call.incoming) { // отклоняем входящий
    emit('call-reject', { to: call.peer, reason: 'declined' });
    const p = call.peer;
    Object.assign(call, { active: false, incoming: false, peer: null, pendingOffer: null, pendingCandidates: [] });
    stopRing(); hideCallUI();
    if (p) {
      pushMsg(state.me, p, { id: uid(), from: state.me, to: p, kind: 'call', text: 'Пропущенный звонок', at: Date.now(), read: true });
      renderAll();
    }
    return;
  }
  endCall('Завершено');
});

$('#btnAccept').addEventListener('click', acceptCall);

$('#btnMute').addEventListener('click', () => {
  const tracks = call.localStream ? call.localStream.getAudioTracks() : [];
  if (!tracks.length) return;
  const on = tracks[0].enabled;
  tracks.forEach(t => t.enabled = !on);
  $('#btnMute').classList.toggle('off', on);
  toast(on ? 'Микрофон выключен' : 'Микрофон включён', 1400);
});

$('#btnCam').addEventListener('click', () => {
  const tracks = call.localStream ? call.localStream.getVideoTracks() : [];
  if (!tracks.length) return toast('Камера недоступна', 1500);
  const on = tracks[0].enabled;
  tracks.forEach(t => t.enabled = !on);
  $('#btnCam').classList.toggle('off', on);
  $('#localVideo').style.opacity = on ? '0' : '1';
});

/* ==================================================================
   ОБРАБОТКА СОБЫТИЙ ОТ ДРУГИХ ВКЛАДОК
   ================================================================== */
if (bus) {
  bus.onmessage = async (e) => {
    const { type, payload, from } = e.data || {};
    if (!type) return;

    if (type === 'update') { if (state.me) renderAll(); return; }
    if (!state.me) return;

    switch (type) {
      case 'notify': {
        if (payload.to === state.me && document.hidden) {
          toast('Новое сообщение от @' + from);
        }
        break;
      }

      case 'call-offer': {
        if (payload.to !== state.me) return;
        if (call.active) { emit('call-reject', { to: from, reason: 'busy' }); return; }
        call.active = true;
        call.incoming = true;
        call.role = 'callee';
        call.peer = from;
        call.video = !!payload.video;
        call.pendingOffer = payload;
        call.pendingCandidates = [];
        showIncoming(from, call.video);
        break;
      }

      case 'call-answer': {
        if (payload.to !== state.me || !call.pc) return;
        clearTimeout(call.timeout);
        try {
          await call.pc.setRemoteDescription(payload.sdp);
          for (const c of call.pendingCandidates) { try { await call.pc.addIceCandidate(c); } catch {} }
          call.pendingCandidates = [];
          setCallStatus('Соединение…', true);
        } catch (err) { endCall('Ошибка соединения'); }
        break;
      }

      case 'call-ice': {
        if (payload.to !== state.me) return;
        if (call.pc && call.pc.remoteDescription && call.pc.remoteDescription.type) {
          try { await call.pc.addIceCandidate(payload.candidate); } catch {}
        } else {
          call.pendingCandidates.push(payload.candidate);
        }
        break;
      }

      case 'call-reject': {
        if (payload.to !== state.me) return;
        endCall(payload.reason === 'busy' ? 'Занято' : 'Отклонено');
        break;
      }

      case 'call-end': {
        if (payload.to !== state.me) return;
        endCall('Завершено');
        break;
      }
    }
  };
}

/* ==================================================================
   ФОНОВЫЕ ЗАДАЧИ
   ================================================================== */
setInterval(() => {
  if (!state.me) return;
  heartbeat();
}, 3000);

setInterval(() => {
  if (!state.me) return;
  renderHeaderStatus();
  renderChats();
  if (state.tab === 'friends') renderFriends();
}, 5000);

window.addEventListener('beforeunload', () => {
  if (!state.me) return;
  const p = db.get(LS.presence, {});
  delete p[state.me];
  db.set(LS.presence, p);
  if (call.active) emit('call-end', { to: call.peer });
});

/* ==================================================================
   ИНИЦИАЛИЗАЦИЯ
   ================================================================== */
(function init() {
  const session = sessionStorage.getItem(SS_SESSION);
  if (session && getUsers()[session]) {
    state.me = session;
    heartbeat();
    startApp();
  } else {
    const last = Object.keys(getUsers())[0];
    if (last) $('#authUser').value = last;
    setTimeout(() => $('#authUser').focus(), 300);
  }
})();
</script>
