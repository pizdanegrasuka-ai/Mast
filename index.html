<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StepClub — Глобальный чат</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  :root{
    --bg:#06060b;
    --panel:rgba(18,18,30,.72);
    --border:rgba(255,255,255,.08);
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --text:#e9e9f2;
    --muted:#8a8aa3;
  }

  html,body{height:100%}

  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Inter',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  body::before{
    content:'';
    position:fixed;
    inset:-40%;
    background:
      radial-gradient(circle at 18% 18%, rgba(124,92,255,.30), transparent 42%),
      radial-gradient(circle at 82% 72%, rgba(34,211,238,.20), transparent 42%),
      radial-gradient(circle at 50% 105%, rgba(236,72,153,.18), transparent 48%);
    filter:blur(60px);
    animation:float 20s ease-in-out infinite alternate;
    z-index:0;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    z-index:0;
    pointer-events:none;
  }
  @keyframes float{
    0%  {transform:translate3d(-3%,-2%,0) scale(1)}
    50% {transform:translate3d(2%,3%,0) scale(1.08)}
    100%{transform:translate3d(3%,-3%,0) scale(1.03)}
  }

  .hidden{display:none !important}

  /* ================= ЭКРАН ВХОДА ================= */
  #loginScreen{
    position:relative;
    z-index:2;
    height:100dvh;
    display:grid;
    place-items:center;
    padding:20px;
  }

  .login-card{
    width:min(440px,94vw);
    padding:44px 34px 34px;
    border-radius:26px;
    background:linear-gradient(160deg, rgba(30,30,48,.85), rgba(12,12,22,.92));
    border:1px solid var(--border);
    box-shadow:
      0 40px 90px rgba(0,0,0,.7),
      0 0 0 1px rgba(124,92,255,.10),
      inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    animation:cardIn .55s cubic-bezier(.2,.9,.3,1.2);
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:'';
    position:absolute;
    top:-60%;left:-30%;
    width:160%;height:120%;
    background:radial-gradient(circle at 50% 0%, rgba(124,92,255,.28), transparent 60%);
    pointer-events:none;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.96)}
    to{opacity:1;transform:none}
  }

  .logo{
    font-size:42px;
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1;
    text-align:center;
    background:linear-gradient(100deg,#fff 10%, var(--accent) 45%, var(--accent2) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(124,92,255,.45));
    position:relative;
  }

  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:14px 0 6px;
    position:relative;
  }

  .badge-global{
    display:flex;
    justify-content:center;
    margin-bottom:26px;
  }
  .badge-global span{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:5px 13px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:#9fe8d8;
    background:rgba(34,211,238,.09);
    border:1px solid rgba(34,211,238,.24);
  }
  .badge-global svg{width:13px;height:13px}

  .field{position:relative;margin-bottom:14px}

  .input{
    width:100%;
    padding:15px 18px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .input::placeholder{color:#5f5f78}
  .input:focus{
    border-color:rgba(124,92,255,.75);
    background:rgba(124,92,255,.07);
    box-shadow:0 0 0 4px rgba(124,92,255,.14);
  }
  .input.invalid{
    border-color:rgba(255,80,110,.75);
    box-shadow:0 0 0 4px rgba(255,80,110,.13);
  }

  .btn-primary{
    width:100%;
    padding:15px 20px;
    margin-top:6px;
    border:none;
    border-radius:15px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(120deg, var(--accent), #a855f7 45%, var(--accent2));
    background-size:200% 100%;
    box-shadow:0 12px 34px rgba(124,92,255,.42);
    transition:transform .16s, box-shadow .22s, background-position .5s, opacity .2s;
    position:relative;
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);
    background-position:100% 0;
    box-shadow:0 18px 42px rgba(124,92,255,.55);
  }
  .btn-primary:active:not(:disabled){transform:translateY(0) scale(.985)}
  .btn-primary:disabled{opacity:.65;cursor:wait}

  .error{
    min-height:20px;
    margin-top:12px;
    font-size:13.5px;
    color:#ff6b8a;
    text-align:center;
    opacity:0;
    transform:translateY(-4px);
    transition:.22s;
  }
  .error.show{opacity:1;transform:none}

  .hint{
    margin-top:18px;
    text-align:center;
    font-size:12px;
    color:#55556b;
    line-height:1.6;
  }

  /* ================= ЧАТ ================= */
  #chatScreen{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100dvh;
  }

  .header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 20px;
    background:rgba(10,10,18,.62);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .header-logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.6px;
    background:linear-gradient(100deg,#fff, var(--accent) 60%, var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }

  .pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 13px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    transition:.2s;
  }

  .online-pill{
    color:#9fe8d8;
    background:rgba(34,211,238,.09);
    border:1px solid rgba(34,211,238,.24);
  }

  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#2ee6a8;
    box-shadow:0 0 10px #2ee6a8;
    animation:pulse 1.8s infinite;
  }

  .status-pill{
    color:#c8c8dd;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    font-size:11.5px;
  }
  .status-pill .sdot{
    width:7px;height:7px;border-radius:50%;
    background:#8a8aa3;
  }
  .status-pill.connected .sdot{background:#2ee6a8;box-shadow:0 0 8px #2ee6a8}
  .status-pill.connecting .sdot{background:#ffb347;box-shadow:0 0 8px #ffb347;animation:pulse 1.4s infinite}
  .status-pill.error .sdot{background:#ff5c7a;box-shadow:0 0 8px #ff5c7a}

  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.75)}
  }

  .spacer{flex:1}

  .user-chip{
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 6px 5px 5px;
    border-radius:999px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
  }
  .user-chip .name{
    font-size:13.5px;
    font-weight:600;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .avatar{
    width:38px;height:38px;
    flex:0 0 38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:15px;
    color:#fff;
    text-transform:uppercase;
    background:linear-gradient(135deg,
      hsl(var(--hue) 85% 62%),
      hsl(calc(var(--hue) + 55) 82% 46%));
    box-shadow:0 4px 16px hsl(var(--hue) 85% 55% / .38);
    user-select:none;
  }
  .user-chip .avatar{width:30px;height:30px;flex-basis:30px;font-size:12.5px}

  .icon-btn{
    width:36px;height:36px;
    flex:0 0 36px;
    display:grid;place-items:center;
    border-radius:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    cursor:pointer;
    transition:.18s;
  }
  .icon-btn:hover{
    color:#ff7a95;
    border-color:rgba(255,90,120,.4);
    background:rgba(255,90,120,.10);
  }

  /* ================= СООБЩЕНИЯ ================= */
  .messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 20px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
    overscroll-behavior:contain;
  }
  .messages::-webkit-scrollbar{width:9px}
  .messages::-webkit-scrollbar-track{background:transparent}
  .messages::-webkit-scrollbar-thumb{
    background:rgba(124,92,255,.30);
    border-radius:99px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  .messages::-webkit-scrollbar-thumb:hover{background:rgba(124,92,255,.55);background-clip:content-box}

  .day{
    align-self:center;
    margin:18px 0 10px;
    padding:5px 15px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.4px;
    color:var(--muted);
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    border-radius:999px;
    text-transform:uppercase;
  }

  .msg{
    display:flex;
    align-items:flex-end;
    gap:11px;
    padding:4px 8px;
    border-radius:14px;
    animation:msgIn .28s cubic-bezier(.2,.9,.3,1.1);
    transition:background .15s;
  }
  .msg:hover{background:rgba(255,255,255,.028)}
  @keyframes msgIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }

  .msg.own{flex-direction:row-reverse}

  .bubble{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
    max-width:min(660px,76%);
    padding:8px 14px 9px;
    border-radius:16px;
    border-top-left-radius:5px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.055);
  }
  .msg.own .bubble{
    border-top-left-radius:16px;
    border-top-right-radius:5px;
    background:linear-gradient(135deg, rgba(124,92,255,.30), rgba(34,211,238,.14));
    border-color:rgba(124,92,255,.34);
  }

  .meta{
    display:flex;
    align-items:baseline;
    gap:9px;
    line-height:1;
  }
  .msg.own .meta{flex-direction:row-reverse}

  .nick{
    font-size:13px;
    font-weight:700;
    letter-spacing:.1px;
  }
  .time{
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }

  .text{
    font-size:14.6px;
    line-height:1.48;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
  }

  .empty{
    margin:auto;
    text-align:center;
    color:#55556b;
    font-size:14px;
    line-height:1.8;
    padding:30px;
  }
  .empty b{
    display:block;
    font-size:34px;
    margin-bottom:10px;
    filter:grayscale(.3);
  }

  /* ================= ПОЛЕ ВВОДА ================= */
  .composer{
    flex:0 0 auto;
    display:flex;
    align-items:flex-end;
    gap:11px;
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:rgba(10,10,18,.62);
    border-top:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .composer textarea{
    flex:1 1 auto;
    resize:none;
    max-height:140px;
    padding:13px 17px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    line-height:1.45;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .composer textarea::placeholder{color:#5f5f78}
  .composer textarea:focus{
    border-color:rgba(124,92,255,.7);
    background:rgba(124,92,255,.06);
    box-shadow:0 0 0 4px rgba(124,92,255,.13);
  }

  .send-btn{
    width:48px;height:48px;
    flex:0 0 48px;
    display:grid;place-items:center;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 10px 26px rgba(124,92,255,.42);
    transition:transform .16s, box-shadow .22s;
  }
  .send-btn:hover{transform:translateY(-2px);box-shadow:0 15px 34px rgba(124,92,255,.58)}
  .send-btn:active{transform:scale(.93)}
  .send-btn svg{width:21px;height:21px}

  /* ================= МОБИЛЬНАЯ ================= */
  @media (max-width:680px){
    .header{padding:11px 13px;gap:8px}
    .header-logo{font-size:17px}
    .pill{padding:5px 10px;font-size:11px}
    .status-pill{display:none}
    .user-chip .name{display:none}
    .user-chip{padding:4px}
    .messages{padding:14px 12px 6px}
    .composer{padding:11px 12px calc(13px + env(safe-area-inset-bottom));gap:9px}
    .bubble{max-width:82%}
    .avatar{width:34px;height:34px;flex-basis:34px;font-size:13.5px}
    .login-card{padding:36px 24px 28px}
    .logo{font-size:36px}
  }
</style>
</head>
<body>

<!-- ================= ЭКРАН ВХОДА ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">StepClub</div>
    <p class="tagline">Глобальный чат — со всем миром</p>
    <div class="badge-global">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Один чат на весь мир
      </span>
    </div>

    <div class="field">
      <input id="nameInput" class="input" type="text" placeholder="Твой ник"
             maxlength="16" autocomplete="off" spellcheck="false">
    </div>

    <button id="joinBtn" class="btn-primary">Войти в чат</button>
    <div id="loginError" class="error"></div>
    <div class="hint">3–16 символов · буквы, цифры, «_»<br>Любой человек в мире увидит твои сообщения</div>
  </div>
</div>

<!-- ================= ЧАТ ================= -->
<div id="chatScreen" class="hidden">

  <header class="header">
    <div class="header-logo">StepClub</div>

    <div class="pill online-pill">
      <span class="dot"></span>
      <span id="onlineCount">1</span>&nbsp;онлайн
    </div>

    <div class="pill status-pill" id="statusPill">
      <span class="sdot"></span>
      <span id="statusText">Подключение…</span>
    </div>

    <div class="spacer"></div>

    <div class="user-chip">
      <div class="avatar" id="userAvatar">?</div>
      <span class="name" id="userName">—</span>
    </div>

    <button class="icon-btn" id="logoutBtn" title="Выйти">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <main class="messages" id="messages">
    <div class="empty" id="emptyState">
      <b>🌍</b>
      Пока здесь тихо.<br>Напиши первое сообщение — его увидит весь мир!
    </div>
  </main>

  <div class="composer">
    <textarea id="msgInput" rows="1" placeholder="Написать в мир..." maxlength="2000"></textarea>
    <button class="send-btn" id="sendBtn" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ==================== КОНФИГ ==================== */
  // Публичный брокер ntfy.sh — без регистрации, без API-ключей, глобальный.
  // Все, кто откроет эту страницу, подключаются к одному топику = общий чат.
  const NTFY            = 'https://ntfy.sh';
  const TOPIC_CHAT      = 'stepclub_global_chat_v1_a7x9k2m4q8';   // общий чат
  const TOPIC_PRESENCE  = 'stepclub_global_presence_v1_a7x9k2m4q8'; // онлайн-статусы

  const PING_INTERVAL   = 10000;   // каждые 10 сек шлём «я онлайн»
  const ONLINE_TIMEOUT  = 32000;   // если 32 сек нет пинга — оффлайн
  const PRESENCE_CHECK  = 60000;   // окно проверки занятости ника при входе
  const CACHE_KEY       = 'stepclub_cache_v2';
  const ME_KEY          = 'stepclub_me_v2';
  const MAX_CACHE       = 3000;

  /* ==================== DOM ==================== */
  const loginScreen = document.getElementById('loginScreen');
  const chatScreen  = document.getElementById('chatScreen');
  const nameInput   = document.getElementById('nameInput');
  const joinBtn     = document.getElementById('joinBtn');
  const loginError  = document.getElementById('loginError');

  const messagesEl  = document.getElementById('messages');
  const emptyState  = document.getElementById('emptyState');
  const msgInput    = document.getElementById('msgInput');
  const sendBtn     = document.getElementById('sendBtn');
  const logoutBtn   = document.getElementById('logoutBtn');
  const onlineCount = document.getElementById('onlineCount');
  const userAvatar  = document.getElementById('userAvatar');
  const userName    = document.getElementById('userName');
  const statusPill  = document.getElementById('statusPill');
  const statusText  = document.getElementById('statusText');

  /* ==================== СОСТОЯНИЕ ==================== */
  let currentUser   = null;
  let onlineUsers   = {};          // name_lower -> { name, ts }
  let renderedIds   = new Set();
  let lastDayKey    = null;
  let chatES        = null;        // EventSource для чата
  let presenceES    = null;        // EventSource для онлайна
  let pingTimer     = null;
  let cleanupTimer  = null;

  /* ==================== УТИЛИТЫ ==================== */
  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h) || 1;
  }

  function dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  }

  function formatDay(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date();
    yest.setDate(today.getDate() - 1);
    if (dayKey(ts) === dayKey(today.getTime())) return 'Сегодня';
    if (dayKey(ts) === dayKey(yest.getTime())) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function isValidName(n) {
    return /^[A-Za-zА-Яа-яЁё0-9_]{3,16}$/.test(n);
  }

  function setStatus(state, text) {
    statusPill.classList.remove('connected', 'connecting', 'error');
    if (state === 'connected') statusPill.classList.add('connected');
    else if (state === 'connecting') statusPill.classList.add('connecting');
    else if (state === 'error') statusPill.classList.add('error');
    statusText.textContent = text;
  }

  /* ==================== ЛОКАЛЬНЫЙ КЭШ ==================== */
  function getCache() {
    try {
      const arr = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveToCache(msg) {
    try {
      const arr = getCache();
      if (arr.some(function (m) { return m.id === msg.id; })) return;
      arr.push(msg);
      if (arr.length > MAX_CACHE) arr.splice(0, arr.length - MAX_CACHE);
      localStorage.setItem(CACHE_KEY, JSON.stringify(arr));
    } catch (e) {}
  }

  /* ==================== ПУБЛИКАЦИЯ ==================== */
  function publish(topic, payload) {
    // ntfy принимает тело запроса как текст сообщения.
    return fetch(NTFY + '/' + topic, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).catch(function () { /* игнорируем сетевые сбои */ });
  }

  function publishChat(msg)  { return publish(TOPIC_CHAT, msg); }
  function publishPresence(p){ return publish(TOPIC_PRESENCE, p); }

  /* ==================== ЗАГРУЗКА ИСТОРИИ ==================== */
  // ntfy отдаёт NDJSON (по одному событию на строку).
  async function fetchHistory(topic, since) {
    try {
      const url = NTFY + '/' + topic + '/json?poll=1&since=' + since;
      const res = await fetch(url);
      if (!res.ok) return [];
      const text = await res.text();
      const lines = text.split('\n').filter(Boolean);
      const out = [];
      for (let i = 0; i < lines.length; i++) {
        try {
          const env = JSON.parse(lines[i]);
          if (env && env.event === 'message' && env.message) {
            out.push(JSON.parse(env.message));
          }
        } catch (e) {}
      }
      return out;
    } catch (e) { return []; }
  }

  /* ==================== ОТРИСОВКА ==================== */
  function createMessageEl(msg) {
    const isOwn = currentUser && msg.name.toLowerCase() === currentUser.toLowerCase();

    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isOwn ? ' own' : '');
    wrap.dataset.id = msg.id;

    const hue = hashCode(msg.name) % 360;

    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.setProperty('--hue', hue);
    av.textContent = msg.name.charAt(0);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const meta = document.createElement('div');
    meta.className = 'meta';

    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = msg.name;
    nick.style.color = 'hsl(' + hue + ' 88% 72%)';

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = formatTime(msg.ts);

    meta.appendChild(nick);
    meta.appendChild(time);

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = msg.text;

    bubble.appendChild(meta);
    bubble.appendChild(text);
    wrap.appendChild(av);
    wrap.appendChild(bubble);

    return wrap;
  }

  function scrollToBottom(smooth) {
    try {
      if (smooth) messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
      else messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (e) { messagesEl.scrollTop = messagesEl.scrollHeight; }
  }

  function appendMessage(msg, doScroll) {
    if (!msg || !msg.id || renderedIds.has(msg.id)) return;
    renderedIds.add(msg.id);

    if (emptyState) emptyState.style.display = 'none';

    const key = dayKey(msg.ts);
    if (key !== lastDayKey) {
      lastDayKey = key;
      const day = document.createElement('div');
      day.className = 'day';
      day.textContent = formatDay(msg.ts);
      messagesEl.appendChild(day);
    }

    messagesEl.appendChild(createMessageEl(msg));
    if (doScroll !== false) scrollToBottom(true);
  }

  /* ==================== ОНЛАЙН ==================== */
  function updateOnlineCount() {
    const now = Date.now();
    let count = 0;
    for (const k in onlineUsers) {
      if (now - onlineUsers[k].ts < ONLINE_TIMEOUT) count++;
    }
    onlineCount.textContent = count;
  }

  function cleanupOnline() {
    const now = Date.now();
    let changed = false;
    for (const k in onlineUsers) {
      if (now - onlineUsers[k].ts >= ONLINE_TIMEOUT) {
        delete onlineUsers[k];
        changed = true;
      }
    }
    if (changed) updateOnlineCount();
  }

  function registerPresence(p) {
    if (!p || !p.name) return;
    const key = String(p.name).toLowerCase();
    if (p.type === 'leave') {
      delete onlineUsers[key];
    } else {
      onlineUsers[key] = { name: p.name, ts: p.ts || Date.now() };
    }
    updateOnlineCount();
  }

  function startPing() {
    stopPing();
    const doPing = function () {
      if (!currentUser) return;
      publishPresence({ type: 'ping', name: currentUser, ts: Date.now() });
    };
    doPing();
    pingTimer = setInterval(doPing, PING_INTERVAL);
  }

  function stopPing() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
  }

  /* ==================== ПОТОКИ ==================== */
  function connectChatStream() {
    if (chatES) { try { chatES.close(); } catch (e) {} }
    setStatus('connecting', 'Подключение…');

    try {
      chatES = new EventSource(NTFY + '/' + TOPIC_CHAT + '/sse');
    } catch (e) {
      setStatus('error', 'Ошибка');
      return;
    }

    chatES.onopen = function () { setStatus('connected', 'Онлайн'); };

    chatES.onmessage = function (e) {
      try {
        const env = JSON.parse(e.data);
        if (!env || env.event !== 'message' || !env.message) return;
        const payload = JSON.parse(env.message);
        if (payload && payload.id && payload.name && typeof payload.text === 'string') {
          saveToCache(payload);
          appendMessage(payload, true);
        }
      } catch (err) {}
    };

    chatES.onerror = function () {
      setStatus('connecting', 'Переподключение…');
      // EventSource сам переподключится
    };
  }

  function connectPresenceStream() {
    if (presenceES) { try { presenceES.close(); } catch (e) {} }

    try {
      presenceES = new EventSource(NTFY + '/' + TOPIC_PRESENCE + '/sse');
    } catch (e) { return; }

    presenceES.onmessage = function (e) {
      try {
        const env = JSON.parse(e.data);
        if (!env || env.event !== 'message' || !env.message) return;
        const payload = JSON.parse(env.message);
        registerPresence(payload);
      } catch (err) {}
    };

    presenceES.onerror = function () { /* сам переподключится */ };
  }

  /* ==================== ВХОД ==================== */
  function showError(text) {
    loginError.textContent = text;
    loginError.classList.add('show');
    nameInput.classList.add('invalid');
    setTimeout(function () { nameInput.classList.remove('invalid'); }, 900);
  }

  function clearError() {
    loginError.classList.remove('show');
    nameInput.classList.remove('invalid');
  }

  async function isNameTaken(name) {
    // Тянем присутствие за последнюю минуту с сервера + локальный кэш онлайна
    const fromServer = await fetchHistory(TOPIC_PRESENCE, '1m');
    const now = Date.now();
    const low = name.toLowerCase();

    const check = function (p) {
      return p && p.name && p.name.toLowerCase() === low
          && p.type !== 'leave'
          && (now - (p.ts || 0)) < ONLINE_TIMEOUT;
    };

    if (fromServer.some(check)) return true;
    for (const k in onlineUsers) {
      if (k === low && (now - onlineUsers[k].ts) < ONLINE_TIMEOUT) return true;
    }
    return false;
  }

  async function tryJoin() {
    const name = nameInput.value.trim();

    if (!name) { showError('Введи ник'); return; }
    if (!isValidName(name)) {
      showError('3–16 символов: буквы, цифры и «_»');
      return;
    }

    clearError();
    joinBtn.disabled = true;
    joinBtn.textContent = 'Проверяю ник…';

    let taken = false;
    try { taken = await isNameTaken(name); }
    catch (e) { taken = false; }

    joinBtn.disabled = false;
    joinBtn.textContent = 'Войти в чат';

    if (taken) {
      showError('Этот ник сейчас в сети — выбери другой');
      return;
    }

    currentUser = name;
    try { sessionStorage.setItem(ME_KEY, name); } catch (e) {}
    enterChat();
  }

  async function enterChat() {
    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');

    const hue = hashCode(currentUser) % 360;
    userAvatar.textContent = currentUser.charAt(0);
    userAvatar.style.setProperty('--hue', hue);
    userName.textContent = currentUser;

    // Сначала — старый локальный кэш (наша «вечная» история)
    const cached = getCache().sort(function (a, b) { return a.ts - b.ts; });
    cached.forEach(function (m) { appendMessage(m, false); });

    // Затем — подтягиваем серверную историю (все сообщения, что ещё живы на сервере)
    fetchHistory(TOPIC_CHAT, 'all').then(function (remote) {
      remote.sort(function (a, b) { return a.ts - b.ts; });
      let appended = false;
      remote.forEach(function (m) {
        if (m && m.id && !renderedIds.has(m.id)) {
          saveToCache(m);
          appendMessage(m, false);
          appended = true;
        }
      });
      if (renderedIds.size === 0 && emptyState) emptyState.style.display = '';
      if (appended) scrollToBottom(false);
    });

    // Заявляем о себе
    publishPresence({ type: 'join', name: currentUser, ts: Date.now() });
    registerPresence({ type: 'join', name: currentUser, ts: Date.now() });
    startPing();

    connectChatStream();
    connectPresenceStream();

    cleanupTimer = setInterval(cleanupOnline, 8000);

    setTimeout(function () { msgInput.focus(); scrollToBottom(false); }, 60);
  }

  function logout() {
    if (currentUser) {
      publishPresence({ type: 'leave', name: currentUser, ts: Date.now() });
      delete onlineUsers[currentUser.toLowerCase()];
    }
    stopPing();
    if (cleanupTimer) { clearInterval(cleanupTimer); cleanupTimer = null; }
    if (chatES)      { try { chatES.close(); } catch (e) {} chatES = null; }
    if (presenceES)  { try { presenceES.close(); } catch (e) {} presenceES = null; }

    currentUser = null;
    try { sessionStorage.removeItem(ME_KEY); } catch (e) {}

    chatScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    nameInput.value = '';
    clearError();
    nameInput.focus();
  }

  /* ==================== ОТПРАВКА ==================== */
  function sendMessage() {
    if (!currentUser) return;
    const text = msgInput.value.trim();
    if (!text) return;

    const msg = {
      id: uid(),
      name: currentUser,
      text: text.slice(0, 2000),
      ts: Date.now()
    };

    // 1) Мгновенно показываем у себя
    saveToCache(msg);
    appendMessage(msg, true);

    // 2) Отправляем в мир
    publishChat(msg);

    // 3) Чистим поле
    msgInput.value = '';
    autoGrow();
    msgInput.focus();
  }

  function autoGrow() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
  }

  /* ==================== СОБЫТИЯ ==================== */
  joinBtn.addEventListener('click', tryJoin);

  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); tryJoin(); }
  });
  nameInput.addEventListener('input', clearError);

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('input', autoGrow);
  msgInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  logoutBtn.addEventListener('click', logout);

  window.addEventListener('beforeunload', function () {
    if (currentUser) {
      // Пытаемся отправить «leave» синхронно — сработает не всегда, но лучше чем ничего.
      try {
        const body = JSON.stringify({ type: 'leave', name: currentUser, ts: Date.now() });
        if (navigator.sendBeacon) {
          navigator.sendBeacon(NTFY + '/' + TOPIC_PRESENCE, body);
        } else {
          fetch(NTFY + '/' + TOPIC_PRESENCE, { method: 'POST', body: body, keepalive: true });
        }
      } catch (e) {}
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && currentUser) {
      publishPresence({ type: 'ping', name: currentUser, ts: Date.now() });
      registerPresence({ type: 'ping', name: currentUser, ts: Date.now() });
    }
  });

  /* ==================== СТАРТ ==================== */
  (function init() {
    let saved = null;
    try { saved = sessionStorage.getItem(ME_KEY); } catch (e) {}

    if (saved && isValidName(saved)) {
      currentUser = saved;
      enterChat();
    } else {
      loginScreen.classList.remove('hidden');
      chatScreen.classList.add('hidden');
      setTimeout(function () { nameInput.focus(); }, 200);
    }
  })();

})();
</script>
