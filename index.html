<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>StepClub — Глобальный чат</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  :root{
    --bg:#06060b;
    --panel:rgba(18,18,30,.72);
    --border:rgba(255,255,255,.08);
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --text:#e9e9f2;
    --muted:#8a8aa3;
    --danger:#ff5c7a;
    --danger-soft:rgba(255,92,122,.12);
    --danger-border:rgba(255,92,122,.32);
  }

  html,body{height:100%}

  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Inter',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    height:100dvh;
    -webkit-font-smoothing:antialiased;
  }

  body::before{
    content:'';
    position:fixed;
    inset:-40%;
    background:
      radial-gradient(circle at 18% 18%, rgba(124,92,255,.30), transparent 42%),
      radial-gradient(circle at 82% 72%, rgba(34,211,238,.20), transparent 42%),
      radial-gradient(circle at 50% 105%, rgba(236,72,153,.18), transparent 48%);
    filter:blur(60px);
    animation:float 20s ease-in-out infinite alternate;
    z-index:0;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
    z-index:0;
    pointer-events:none;
  }
  @keyframes float{
    0%  {transform:translate3d(-3%,-2%,0) scale(1)}
    50% {transform:translate3d(2%,3%,0) scale(1.08)}
    100%{transform:translate3d(3%,-3%,0) scale(1.03)}
  }

  .hidden{display:none !important}

  /* ================= ЭКРАН ВХОДА ================= */
  #loginScreen{
    position:relative;
    z-index:2;
    height:100dvh;
    display:grid;
    place-items:center;
    padding:20px;
  }

  .login-card{
    width:min(440px,94vw);
    padding:44px 34px 34px;
    border-radius:26px;
    background:linear-gradient(160deg, rgba(30,30,48,.85), rgba(12,12,22,.92));
    border:1px solid var(--border);
    box-shadow:
      0 40px 90px rgba(0,0,0,.7),
      0 0 0 1px rgba(124,92,255,.10),
      inset 0 1px 0 rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    animation:cardIn .55s cubic-bezier(.2,.9,.3,1.2);
    position:relative;
    overflow:hidden;
  }
  .login-card::before{
    content:'';
    position:absolute;
    top:-60%;left:-30%;
    width:160%;height:120%;
    background:radial-gradient(circle at 50% 0%, rgba(124,92,255,.28), transparent 60%);
    pointer-events:none;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(26px) scale(.96)}
    to{opacity:1;transform:none}
  }

  .logo{
    font-size:42px;
    font-weight:800;
    letter-spacing:-1.5px;
    line-height:1;
    text-align:center;
    background:linear-gradient(100deg,#fff 10%, var(--accent) 45%, var(--accent2) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 26px rgba(124,92,255,.45));
    position:relative;
  }

  .tagline{
    text-align:center;
    color:var(--muted);
    font-size:14px;
    margin:14px 0 6px;
    position:relative;
  }

  .badge-global{
    display:flex;
    justify-content:center;
    margin-bottom:26px;
  }
  .badge-global span{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:5px 13px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    color:#9fe8d8;
    background:rgba(34,211,238,.09);
    border:1px solid rgba(34,211,238,.24);
  }
  .badge-global svg{width:13px;height:13px}

  .field{position:relative;margin-bottom:14px}

  .input{
    width:100%;
    padding:15px 18px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .input::placeholder{color:#5f5f78}
  .input:focus{
    border-color:rgba(124,92,255,.75);
    background:rgba(124,92,255,.07);
    box-shadow:0 0 0 4px rgba(124,92,255,.14);
  }
  .input.invalid{
    border-color:rgba(255,80,110,.75);
    box-shadow:0 0 0 4px rgba(255,80,110,.13);
  }

  .btn-primary{
    width:100%;
    padding:15px 20px;
    margin-top:6px;
    border:none;
    border-radius:15px;
    font-family:inherit;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.3px;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(120deg, var(--accent), #a855f7 45%, var(--accent2));
    background-size:200% 100%;
    box-shadow:0 12px 34px rgba(124,92,255,.42);
    transition:transform .16s, box-shadow .22s, background-position .5s, opacity .2s;
    position:relative;
  }
  .btn-primary:hover:not(:disabled){
    transform:translateY(-2px);
    background-position:100% 0;
    box-shadow:0 18px 42px rgba(124,92,255,.55);
  }
  .btn-primary:active:not(:disabled){transform:translateY(0) scale(.985)}
  .btn-primary:disabled{opacity:.65;cursor:wait}

  .error{
    min-height:20px;
    margin-top:12px;
    font-size:13.5px;
    color:#ff6b8a;
    text-align:center;
    opacity:0;
    transform:translateY(-4px);
    transition:.22s;
  }
  .error.show{opacity:1;transform:none}

  .hint{
    margin-top:18px;
    text-align:center;
    font-size:12px;
    color:#55556b;
    line-height:1.6;
  }

  /* ================= ЧАТ ================= */
  #chatScreen{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    height:100dvh;
  }

  .header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:14px;
    padding:13px 20px;
    background:rgba(10,10,18,.62);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }

  .header-logo{
    font-size:20px;
    font-weight:800;
    letter-spacing:-.6px;
    background:linear-gradient(100deg,#fff, var(--accent) 60%, var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    white-space:nowrap;
  }

  .pill{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px 13px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    transition:.2s;
  }

  .online-pill{
    color:#9fe8d8;
    background:rgba(34,211,238,.09);
    border:1px solid rgba(34,211,238,.24);
  }

  .dot{
    width:7px;height:7px;border-radius:50%;
    background:#2ee6a8;
    box-shadow:0 0 10px #2ee6a8;
    animation:pulse 1.8s infinite;
  }

  .status-pill{
    color:#c8c8dd;
    background:rgba(255,255,255,.05);
    border:1px solid var(--border);
    font-size:11.5px;
  }
  .status-pill .sdot{
    width:7px;height:7px;border-radius:50%;
    background:#8a8aa3;
  }
  .status-pill.connected .sdot{background:#2ee6a8;box-shadow:0 0 8px #2ee6a8}
  .status-pill.connecting .sdot{background:#ffb347;box-shadow:0 0 8px #ffb347;animation:pulse 1.4s infinite}
  .status-pill.error .sdot{background:#ff5c7a;box-shadow:0 0 8px #ff5c7a}

  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.75)}
  }

  .spacer{flex:1}

  .user-chip{
    display:flex;
    align-items:center;
    gap:9px;
    padding:5px 6px 5px 5px;
    border-radius:999px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    transition:.25s;
  }
  .user-chip.muted{
    border-color:var(--danger-border);
    background:var(--danger-soft);
  }
  .user-chip .name{
    font-size:13.5px;
    font-weight:600;
    max-width:130px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .avatar{
    width:38px;height:38px;
    flex:0 0 38px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-weight:800;
    font-size:15px;
    color:#fff;
    text-transform:uppercase;
    background:linear-gradient(135deg,
      hsl(var(--hue) 85% 62%),
      hsl(calc(var(--hue) + 55) 82% 46%));
    box-shadow:0 4px 16px hsl(var(--hue) 85% 55% / .38);
    user-select:none;
  }
  .user-chip .avatar{width:30px;height:30px;flex-basis:30px;font-size:12.5px}

  .icon-btn{
    width:36px;height:36px;
    flex:0 0 36px;
    display:grid;place-items:center;
    border-radius:11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.04);
    color:var(--muted);
    cursor:pointer;
    transition:.18s;
  }
  .icon-btn:hover{
    color:#ff7a95;
    border-color:rgba(255,90,120,.4);
    background:rgba(255,90,120,.10);
  }

  /* ================= СООБЩЕНИЯ ================= */
  .messages{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:20px 20px 10px;
    display:flex;
    flex-direction:column;
    gap:2px;
    overscroll-behavior:contain;
  }
  .messages::-webkit-scrollbar{width:9px}
  .messages::-webkit-scrollbar-track{background:transparent}
  .messages::-webkit-scrollbar-thumb{
    background:rgba(124,92,255,.30);
    border-radius:99px;
    border:2px solid transparent;
    background-clip:content-box;
  }
  .messages::-webkit-scrollbar-thumb:hover{background:rgba(124,92,255,.55);background-clip:content-box}

  .day{
    align-self:center;
    margin:18px 0 10px;
    padding:5px 15px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.4px;
    color:var(--muted);
    background:rgba(255,255,255,.045);
    border:1px solid var(--border);
    border-radius:999px;
    text-transform:uppercase;
  }

  .sysmsg{
    align-self:center;
    margin:9px auto;
    padding:8px 18px;
    border-radius:14px;
    font-size:13px;
    font-weight:600;
    text-align:center;
    color:#ffb3c1;
    background:linear-gradient(180deg, rgba(255,92,122,.13), rgba(255,92,122,.07));
    border:1px solid var(--danger-border);
    box-shadow:0 4px 18px rgba(255,92,122,.10);
    max-width:92%;
    animation:sysIn .45s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes sysIn{
    from{opacity:0;transform:translateY(8px) scale(.94)}
    to{opacity:1;transform:none}
  }

  .msg{
    display:flex;
    align-items:flex-end;
    gap:11px;
    padding:4px 8px;
    border-radius:14px;
    animation:msgIn .28s cubic-bezier(.2,.9,.3,1.1);
    transition:background .15s;
  }
  .msg:hover{background:rgba(255,255,255,.028)}
  @keyframes msgIn{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }

  .msg.own{flex-direction:row-reverse}

  .bubble{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
    max-width:min(660px,76%);
    padding:8px 14px 9px;
    border-radius:16px;
    border-top-left-radius:5px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.055);
  }
  .msg.own .bubble{
    border-top-left-radius:16px;
    border-top-right-radius:5px;
    background:linear-gradient(135deg, rgba(124,92,255,.30), rgba(34,211,238,.14));
    border-color:rgba(124,92,255,.34);
  }

  .meta{
    display:flex;
    align-items:baseline;
    gap:9px;
    line-height:1;
  }
  .msg.own .meta{flex-direction:row-reverse}

  .nick{
    font-size:13px;
    font-weight:700;
    letter-spacing:.1px;
  }
  .time{
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
  }

  .text{
    font-size:14.6px;
    line-height:1.48;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    white-space:pre-wrap;
  }

  .empty{
    margin:auto;
    text-align:center;
    color:#55556b;
    font-size:14px;
    line-height:1.8;
    padding:30px;
  }
  .empty b{
    display:block;
    font-size:34px;
    margin-bottom:10px;
    filter:grayscale(.3);
  }

  /* ================= БАННЕР МУТА ================= */
  .mute-banner{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:5px;
    padding:13px 20px;
    background:linear-gradient(180deg, rgba(255,92,122,.20), rgba(255,92,122,.08));
    border-top:1px solid var(--danger-border);
    color:#ffd0da;
    font-size:13.5px;
    letter-spacing:.2px;
    text-align:center;
    animation:bannerIn .35s cubic-bezier(.2,.9,.3,1.15);
  }
  .mute-banner .row-main{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:800;
    color:#fff;
    font-size:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .mute-banner .row-main svg{width:17px;height:17px;flex:0 0 17px;color:#ff8ba3}
  .mute-banner .until{
    color:#fff;
    font-variant-numeric:tabular-nums;
    background:rgba(255,92,122,.34);
    padding:2px 9px;
    border-radius:7px;
    font-size:13px;
    font-weight:800;
    letter-spacing:.4px;
    box-shadow:0 0 0 1px rgba(255,92,122,.4);
  }
  .mute-banner .row-sub{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:#ffb3c1;
    flex-wrap:wrap;
    justify-content:center;
  }
  .mute-banner .reason{
    color:#ff8ba3;
    font-weight:600;
  }
  .mute-banner .timer{
    font-variant-numeric:tabular-nums;
    color:#fff;
    background:rgba(255,92,122,.22);
    padding:2px 8px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
  }
  @keyframes bannerIn{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:none}
  }

  /* ================= ПОЛЕ ВВОДА ================= */
  .composer{
    flex:0 0 auto;
    display:flex;
    align-items:flex-end;
    gap:11px;
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:rgba(10,10,18,.62);
    border-top:1px solid var(--border);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    transition:opacity .25s;
  }
  .composer.disabled{opacity:.55}

  .composer textarea{
    flex:1 1 auto;
    resize:none;
    max-height:140px;
    padding:13px 17px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.10);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    line-height:1.45;
    outline:none;
    transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .composer textarea::placeholder{color:#5f5f78}
  .composer textarea:focus{
    border-color:rgba(124,92,255,.7);
    background:rgba(124,92,255,.06);
    box-shadow:0 0 0 4px rgba(124,92,255,.13);
  }
  .composer textarea:disabled{
    cursor:not-allowed;
    background:rgba(255,92,122,.06);
    border-color:var(--danger-border);
  }

  .send-btn{
    width:48px;height:48px;
    flex:0 0 48px;
    display:grid;place-items:center;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:0 10px 26px rgba(124,92,255,.42);
    transition:transform .16s, box-shadow .22s, opacity .2s;
  }
  .send-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 34px rgba(124,92,255,.58)}
  .send-btn:active:not(:disabled){transform:scale(.93)}
  .send-btn:disabled{
    cursor:not-allowed;
    opacity:.55;
    background:linear-gradient(135deg, #6b3a48, #7a4a55);
    box-shadow:none;
  }
  .send-btn svg{width:21px;height:21px}

  /* ================= МОБИЛЬНАЯ ================= */
  @media (max-width:680px){
    .header{padding:11px 13px;gap:8px}
    .header-logo{font-size:17px}
    .pill{padding:5px 10px;font-size:11px}
    .status-pill{display:none}
    .user-chip .name{display:none}
    .user-chip{padding:4px}
    .messages{padding:14px 12px 6px}
    .composer{padding:11px 12px calc(13px + env(safe-area-inset-bottom));gap:9px}
    .bubble{max-width:82%}
    .avatar{width:34px;height:34px;flex-basis:34px;font-size:13.5px}
    .login-card{padding:36px 24px 28px}
    .logo{font-size:36px}
    .mute-banner{font-size:12.5px;padding:11px 14px}
    .mute-banner .row-main{font-size:13px}
  }
</style>
</head>
<body>

<!-- ================= ЭКРАН ВХОДА ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="logo">StepClub</div>
    <p class="tagline">Глобальный чат — со всем миром</p>
    <div class="badge-global">
      <span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Один чат на весь мир
      </span>
    </div>

    <div class="field">
      <input id="nameInput" class="input" type="text" placeholder="Твой ник"
             maxlength="16" autocomplete="off" spellcheck="false">
    </div>

    <button id="joinBtn" class="btn-primary">Войти в чат</button>
    <div id="loginError" class="error"></div>
    <div class="hint">3–16 символов · буквы, цифры, «_»<br>Спам = мут на 5 минут</div>
  </div>
</div>

<!-- ================= ЧАТ ================= -->
<div id="chatScreen" class="hidden">

  <header class="header">
    <div class="header-logo">StepClub</div>

    <div class="pill online-pill">
      <span class="dot"></span>
      <span id="onlineCount">1</span>&nbsp;онлайн
    </div>

    <div class="pill status-pill" id="statusPill">
      <span class="sdot"></span>
      <span id="statusText">Подключение…</span>
    </div>

    <div class="spacer"></div>

    <div class="user-chip" id="userChip">
      <div class="avatar" id="userAvatar">?</div>
      <span class="name" id="userName">—</span>
    </div>

    <button class="icon-btn" id="logoutBtn" title="Выйти">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </header>

  <main class="messages" id="messages">
    <div class="empty" id="emptyState">
      <b>🌍</b>
      Пока здесь тихо.<br>Напиши первое сообщение — его увидит весь мир!
    </div>
  </main>

  <!-- Баннер мута (показывается только замученному) -->
  <div class="mute-banner hidden" id="muteBanner">
    <div class="row-main">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5 6 9H2v6h4l5 4V5z"/>
        <line x1="22" y1="9" x2="16" y2="15"/>
        <line x1="16" y1="9" x2="22" y2="15"/>
      </svg>
      <span>Ты больше не можешь писать сообщения до</span>
      <span class="until" id="muteUntil">—</span>
    </div>
    <div class="row-sub">
      <span>Причина: <span class="reason" id="muteReason">спам</span></span>
      <span class="timer" id="muteTimer">5:00</span>
    </div>
  </div>

  <div class="composer" id="composer">
    <textarea id="msgInput" rows="1" placeholder="Написать в мир..." maxlength="2000"></textarea>
    <button class="send-btn" id="sendBtn" title="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ==================== КОНФИГ ==================== */
  const NTFY            = 'https://ntfy.sh';
  const TOPIC_CHAT      = 'stepclub_global_chat_v1_a7x9k2m4q8';
  const TOPIC_PRESENCE  = 'stepclub_global_presence_v1_a7x9k2m4q8';
  const TOPIC_MUTES     = 'stepclub_global_mutes_v1_a7x9k2m4q8';

  const PING_INTERVAL   = 25000;
  const POLL_INTERVAL   = 20000;
  const ONLINE_TIMEOUT  = 60000;

  const CACHE_KEY       = 'stepclub_cache_v2';
  const ME_KEY          = 'stepclub_me_v2';
  const MUTES_KEY       = 'stepclub_mutes_v2';
  const MAX_CACHE       = 3000;

  const MUTE_DURATION   = 5 * 60 * 1000;
  const SPAM_WINDOW     = 10000;
  const SPAM_THRESHOLD  = 5;
  const REPEAT_LIMIT    = 4;
  const CAPS_MIN_LEN    = 10;
  const CAPS_RATIO      = 0.75;

  /* ==================== DOM ==================== */
  const loginScreen = document.getElementById('loginScreen');
  const chatScreen  = document.getElementById('chatScreen');
  const nameInput   = document.getElementById('nameInput');
  const joinBtn     = document.getElementById('joinBtn');
  const loginError  = document.getElementById('loginError');

  const messagesEl  = document.getElementById('messages');
  const emptyState  = document.getElementById('emptyState');
  const msgInput    = document.getElementById('msgInput');
  const sendBtn     = document.getElementById('sendBtn');
  const logoutBtn   = document.getElementById('logoutBtn');
  const onlineCount = document.getElementById('onlineCount');
  const userAvatar  = document.getElementById('userAvatar');
  const userName    = document.getElementById('userName');
  const userChip    = document.getElementById('userChip');
  const statusPill  = document.getElementById('statusPill');
  const statusText  = document.getElementById('statusText');
  const muteBanner  = document.getElementById('muteBanner');
  const muteTimer   = document.getElementById('muteTimer');
  const muteReason  = document.getElementById('muteReason');
  const muteUntil   = document.getElementById('muteUntil');
  const composer    = document.getElementById('composer');

  /* ==================== СОСТОЯНИЕ ==================== */
  let currentUser   = null;
  let onlineUsers   = {};
  let activeMutes   = {};
  let spamTracker   = {};
  let renderedIds   = new Set();
  let lastDayKey    = null;

  let chatStream    = null;
  let mutesStream   = null;

  let pingTimer     = null;
  let presenceTimer = null;
  let cleanupTimer  = null;
  let tickTimer     = null;

  /* ==================== УТИЛИТЫ ==================== */
  function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h) || 1;
  }

  function dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  }

  function formatDay(ts) {
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date();
    yest.setDate(today.getDate() - 1);
    if (dayKey(ts) === dayKey(today.getTime())) return 'Сегодня';
    if (dayKey(ts) === dayKey(yest.getTime())) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatTime(ts) {
    return new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function formatUntilTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
    const isTomorrow = d.toDateString() === tomorrow.toDateString();
    const time = d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    if (sameDay) return time;
    if (isTomorrow) return 'завтра в ' + time;
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ' в ' + time;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function isValidName(n) {
    return /^[A-Za-zА-Яа-яЁё0-9_]{3,16}$/.test(n);
  }

  function setStatus(state, text) {
    statusPill.classList.remove('connected', 'connecting', 'error');
    if (state === 'connected') statusPill.classList.add('connected');
    else if (state === 'connecting') statusPill.classList.add('connecting');
    else if (state === 'error') statusPill.classList.add('error');
    statusText.textContent = text;
  }

  /* ==================== ЛОКАЛЬНЫЙ КЭШ ==================== */
  function getCache() {
    try {
      const arr = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveToCache(msg) {
    try {
      const arr = getCache();
      if (arr.some(function (m) { return m.id === msg.id; })) return;
      arr.push(msg);
      if (arr.length > MAX_CACHE) arr.splice(0, arr.length - MAX_CACHE);
      localStorage.setItem(CACHE_KEY, JSON.stringify(arr));
    } catch (e) {}
  }

  /* ==================== МУТЫ: ХРАНИЛИЩЕ ==================== */
  function loadMutes() {
    try {
      const obj = JSON.parse(localStorage.getItem(MUTES_KEY) || '{}');
      const now = Date.now();
      activeMutes = {};
      for (const k in obj) {
        if (obj[k] && obj[k].until > now) activeMutes[k] = obj[k];
      }
    } catch (e) { activeMutes = {}; }
  }

  function saveMutes() {
    try { localStorage.setItem(MUTES_KEY, JSON.stringify(activeMutes)); } catch (e) {}
  }

  function isMuted(nameKey) {
    const key = String(nameKey).toLowerCase();
    const m = activeMutes[key];
    if (!m) return false;
    if (m.until <= Date.now()) {
      delete activeMutes[key];
      saveMutes();
      return false;
    }
    return true;
  }

  /* ==================== ДЕТЕКТ СПАМА ==================== */
  function detectSpam(name, text) {
    const key = name.toLowerCase();
    const now = Date.now();
    if (!spamTracker[key]) spamTracker[key] = { times: [], lastText: '', repeatCount: 0 };
    const s = spamTracker[key];

    s.times.push(now);
    s.times = s.times.filter(function (t) { return now - t < SPAM_WINDOW; });
    if (s.times.length >= SPAM_THRESHOLD) {
      s.times = []; s.repeatCount = 0;
      return 'флуд — слишком много сообщений подряд';
    }

    const clean = String(text).trim().toLowerCase();
    if (clean.length > 0 && clean === s.lastText) s.repeatCount++;
    else { s.lastText = clean; s.repeatCount = 1; }
    if (s.repeatCount >= REPEAT_LIMIT) {
      s.repeatCount = 0; s.times = [];
      return 'повторяющиеся сообщения';
    }

    const letters = String(text).replace(/[^A-Za-zА-Яа-яЁё]/g, '');
    if (letters.length >= CAPS_MIN_LEN) {
      const upper = (String(text).match(/[A-ZА-ЯЁ]/g) || []).length;
      if (upper / letters.length > CAPS_RATIO) {
        s.times = []; s.repeatCount = 0;
        return 'сообщения капсом';
      }
    }
    return null;
  }

  /* ==================== ПУБЛИКАЦИЯ ==================== */
  function publish(topic, payload) {
    return fetch(NTFY + '/' + topic, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).catch(function () {});
  }

  function publishChat(msg)     { return publish(TOPIC_CHAT, msg); }
  function publishPresence(p)   { return publish(TOPIC_PRESENCE, p); }
  function publishMuteRaw(m)    { return publish(TOPIC_MUTES, m); }

  /* ==================== ЗАГРУЗКА ИСТОРИИ ==================== */
  async function fetchHistory(topic, since) {
    try {
      const url = NTFY + '/' + topic + '/json?poll=1&since=' + since;
      const res = await fetch(url);
      if (!res.ok) return [];
      const text = await res.text();
      const lines = text.split('\n').filter(Boolean);
      const out = [];
      for (let i = 0; i < lines.length; i++) {
        try {
          const env = JSON.parse(lines[i]);
          if (env && env.event === 'message' && env.message) {
            out.push(JSON.parse(env.message));
          }
        } catch (e) {}
      }
      return out;
    } catch (e) { return []; }
  }

  /* ==================== ОТРИСОВКА ==================== */
  function createMessageEl(msg) {
    if (msg.sys) {
      const el = document.createElement('div');
      el.className = 'sysmsg';
      el.textContent = msg.text;
      return el;
    }

    const isOwn = currentUser && msg.name.toLowerCase() === currentUser.toLowerCase();

    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isOwn ? ' own' : '');
    wrap.dataset.id = msg.id;

    const hue = hashCode(msg.name) % 360;

    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.setProperty('--hue', hue);
    av.textContent = msg.name.charAt(0);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const meta = document.createElement('div');
    meta.className = 'meta';

    const nick = document.createElement('span');
    nick.className = 'nick';
    nick.textContent = msg.name;
    nick.style.color = 'hsl(' + hue + ' 88% 72%)';

    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = formatTime(msg.ts);

    meta.appendChild(nick);
    meta.appendChild(time);

    const text = document.createElement('div');
    text.className = 'text';
    text.textContent = msg.text;

    bubble.appendChild(meta);
    bubble.appendChild(text);
    wrap.appendChild(av);
    wrap.appendChild(bubble);
    return wrap;
  }

  function scrollToBottom(smooth) {
    try {
      if (smooth) messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
      else messagesEl.scrollTop = messagesEl.scrollHeight;
    } catch (e) { messagesEl.scrollTop = messagesEl.scrollHeight; }
  }

  function appendMessage(msg, doScroll) {
    if (!msg || !msg.id || renderedIds.has(msg.id)) return;
    renderedIds.add(msg.id);

    if (emptyState) emptyState.style.display = 'none';

    const key = dayKey(msg.ts);
    if (key !== lastDayKey) {
      lastDayKey = key;
      const day = document.createElement('div');
      day.className = 'day';
      day.textContent = formatDay(msg.ts);
      messagesEl.appendChild(day);
    }

    messagesEl.appendChild(createMessageEl(msg));
    if (doScroll !== false) scrollToBottom(true);
  }

  /* ==================== ПРИСУТСТВИЕ ==================== */
  function updateOnlineCount() {
    const now = Date.now();
    let count = 0;
    for (const k in onlineUsers) {
      if (now - onlineUsers[k].ts < ONLINE_TIMEOUT) count++;
    }
    onlineCount.textContent = count;
  }

  async function pollPresence() {
    try {
      const list = await fetchHistory(TOPIC_PRESENCE, '2m');
      const now = Date.now();
      const fresh = {};
      if (currentUser) {
        fresh[currentUser.toLowerCase()] = { name: currentUser, ts: now };
      }
      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        if (!p || !p.name || p.type === 'leave') continue;
        if ((now - (p.ts || 0)) < ONLINE_TIMEOUT) {
          fresh[p.name.toLowerCase()] = { name: p.name, ts: p.ts || now };
        }
      }
      onlineUsers = fresh;
      updateOnlineCount();
    } catch (e) {}
  }

  function startPing() {
    stopPing();
    const doPing = function () {
      if (!currentUser) return;
      publishPresence({ type: 'ping', name: currentUser, ts: Date.now() });
    };
    doPing();
    pingTimer = setInterval(doPing, PING_INTERVAL);
  }

  function stopPing() {
    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
  }

  function startPresencePolling() {
    stopPresencePolling();
    pollPresence();
    presenceTimer = setInterval(pollPresence, POLL_INTERVAL);
  }

  function stopPresencePolling() {
    if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
  }

  /* ==================== МУТЫ: ЛОГИКА ==================== */
  function applyMuteAndShow(mute) {
    if (!mute || mute.type !== 'mute' || !mute.name) return;
    const key = String(mute.name).toLowerCase();
    const existing = activeMutes[key];

    if (existing && existing.until >= mute.until - 2000) return;

    const isFresh = !existing || existing.until <= Date.now();
    activeMutes[key] = mute;
    saveMutes();

    if (isFresh) {
      const bucket = Math.floor((mute.ts || Date.now()) / 5000);
      const ts = mute.ts || Date.now();

      // Публичная системка — видят все
      const sysMsg = {
        id: 'mute_' + key + '_' + bucket,
        sys: true,
        text: '🔇 ' + mute.name + ' получил мут на 5 минут. Причина: ' + mute.reason,
        ts: ts
      };
      saveToCache(sysMsg);
      appendMessage(sysMsg, true);

      // Персональная системка — видит только сам замученный
      if (currentUser && key === currentUser.toLowerCase()) {
        const personalMsg = {
          id: 'mute_self_' + key + '_' + bucket,
          sys: true,
          text: '🔇 Тебе выдан мут на 5 минут — до ' + formatUntilTime(mute.until) +
                '. Причина: ' + mute.reason +
                '. Пока что ты не можешь отправлять сообщения в чат.',
          ts: ts + 1
        };
        saveToCache(personalMsg);
        appendMessage(personalMsg, true);
      }
    }

    if (currentUser && key === currentUser.toLowerCase()) updateMuteUI();
  }

  function publishMute(name, reason) {
    const now = Date.now();
    const mute = {
      type: 'mute',
      name: name,
      reason: reason,
      until: now + MUTE_DURATION,
      by: currentUser || 'anonymous',
      ts: now
    };
    publishMuteRaw(mute);
    applyMuteAndShow(mute);
  }

  function updateMuteUI() {
    if (!currentUser) return;
    const key = currentUser.toLowerCase();
    const m = activeMutes[key];
    const now = Date.now();

    if (m && m.until > now) {
      const left = Math.max(0, Math.ceil((m.until - now) / 1000));
      const mm = Math.floor(left / 60);
      const ss = left % 60;
      const untilStr = formatUntilTime(m.until);
      muteTimer.textContent = 'осталось ' + mm + ':' + String(ss).padStart(2, '0');
      muteUntil.textContent = untilStr;
      muteReason.textContent = m.reason;
      muteBanner.classList.remove('hidden');
      msgInput.disabled = true;
      sendBtn.disabled = true;
      composer.classList.add('disabled');
      userChip.classList.add('muted');
      msgInput.placeholder = 'Ты в муте до ' + untilStr + '…';
    } else {
      muteBanner.classList.add('hidden');
      msgInput.disabled = false;
      sendBtn.disabled = false;
      composer.classList.remove('disabled');
      userChip.classList.remove('muted');
      msgInput.placeholder = 'Написать в мир...';
    }
  }

  /* ==================== SSE С BACKOFF ==================== */
  function openStream(topic, handlers) {
    const state = {
      es: null,
      attempt: 0,
      stopped: false,
      timer: null
    };

    function open() {
      if (state.stopped) return;
      try {
        state.es = new EventSource(NTFY + '/' + topic + '/sse');
      } catch (e) {
        scheduleRetry();
        return;
      }

      state.es.onopen = function () {
        state.attempt = 0;
        if (handlers.onOpen) handlers.onOpen();
      };

      state.es.onmessage = function (e) {
        try {
          const env = JSON.parse(e.data);
          if (env && env.event === 'message' && env.message) {
            handlers.onMessage(JSON.parse(env.message));
          }
        } catch (err) {}
      };

      state.es.onerror = function () {
        try { state.es.close(); } catch (e) {}
        state.es = null;
        scheduleRetry();
      };
    }

    function scheduleRetry() {
      if (state.stopped) return;
      state.attempt++;
      const wait = Math.min(30000, Math.round(800 * Math.pow(1.6, state.attempt)));
      if (handlers.onRetry) handlers.onRetry(state.attempt, wait);
      state.timer = setTimeout(open, wait);
    }

    function close() {
      state.stopped = true;
      if (state.timer) { clearTimeout(state.timer); state.timer = null; }
      if (state.es) { try { state.es.close(); } catch (e) {} state.es = null; }
    }

    open();
    return { close: close };
  }

  /* ==================== ОБРАБОТЧИКИ ПОТОКОВ ==================== */
  function handleChatMessage(payload) {
    if (!payload || !payload.id || !payload.name || typeof payload.text !== 'string') return;
    const key = String(payload.name).toLowerCase();

    if (currentUser && key === currentUser.toLowerCase()) {
      saveToCache(payload);
      appendMessage(payload, true);
      return;
    }
    if (isMuted(key)) return;

    const reason = detectSpam(payload.name, payload.text);
    if (reason) {
      if (!isMuted(key)) {
        setTimeout(function () {
          if (!isMuted(key)) publishMute(payload.name, reason);
        }, 300 + Math.random() * 500);
      }
      return;
    }
    saveToCache(payload);
    appendMessage(payload, true);
  }

  function handleMuteEvent(payload) {
    if (payload && payload.type === 'mute') applyMuteAndShow(payload);
  }

  function connectChatStream() {
    if (chatStream) chatStream.close();
    chatStream = openStream(TOPIC_CHAT, {
      onOpen: function () { setStatus('connected', 'Онлайн'); },
      onRetry: function (n, wait) {
        const s = Math.max(1, Math.round(wait / 1000));
        setStatus('connecting', 'Переподключение #' + n + ' (' + s + 'с)…');
      },
      onMessage: handleChatMessage
    });
  }

  function connectMutesStream() {
    if (mutesStream) mutesStream.close();
    mutesStream = openStream(TOPIC_MUTES, {
      onOpen: function () {},
      onRetry: function () {},
      onMessage: handleMuteEvent
    });
  }

  /* ==================== ВХОД ==================== */
  function showError(text) {
    loginError.textContent = text;
    loginError.classList.add('show');
    nameInput.classList.add('invalid');
    setTimeout(function () { nameInput.classList.remove('invalid'); }, 900);
  }

  function clearError() {
    loginError.classList.remove('show');
    nameInput.classList.remove('invalid');
  }

  async function isNameTaken(name) {
    const fromServer = await fetchHistory(TOPIC_PRESENCE, '2m');
    const now = Date.now();
    const low = name.toLowerCase();

    const check = function (p) {
      return p && p.name && p.name.toLowerCase() === low
          && p.type !== 'leave'
          && (now - (p.ts || 0)) < ONLINE_TIMEOUT;
    };

    if (fromServer.some(check)) return true;
    for (const k in onlineUsers) {
      if (k === low && (now - onlineUsers[k].ts) < ONLINE_TIMEOUT) return true;
    }
    return false;
  }

  async function tryJoin() {
    const name = nameInput.value.trim();
    if (!name) { showError('Введи ник'); return; }
    if (!isValidName(name)) {
      showError('3–16 символов: буквы, цифры и «_»');
      return;
    }

    clearError();
    joinBtn.disabled = true;
    joinBtn.textContent = 'Проверяю ник…';

    let taken = false;
    try { taken = await isNameTaken(name); }
    catch (e) { taken = false; }

    joinBtn.disabled = false;
    joinBtn.textContent = 'Войти в чат';

    if (taken) { showError('Этот ник сейчас в сети — выбери другой'); return; }

    currentUser = name;
    try { sessionStorage.setItem(ME_KEY, name); } catch (e) {}
    enterChat();
  }

  async function enterChat() {
    loginScreen.classList.add('hidden');
    chatScreen.classList.remove('hidden');

    const hue = hashCode(currentUser) % 360;
    userAvatar.textContent = currentUser.charAt(0);
    userAvatar.style.setProperty('--hue', hue);
    userName.textContent = currentUser;

    loadMutes();
    updateMuteUI();

    const cached = getCache().sort(function (a, b) { return a.ts - b.ts; });
    cached.forEach(function (m) { appendMessage(m, false); });

    fetchHistory(TOPIC_CHAT, 'all').then(function (remote) {
      remote.sort(function (a, b) { return a.ts - b.ts; });
      let appended = false;
      remote.forEach(function (m) {
        if (m && m.id && !renderedIds.has(m.id)) {
          saveToCache(m);
          appendMessage(m, false);
          appended = true;
        }
      });
      if (renderedIds.size === 0 && emptyState) emptyState.style.display = '';
      if (appended) scrollToBottom(false);
    });

    fetchHistory(TOPIC_MUTES, '15m').then(function (list) {
      list.forEach(function (m) {
        if (m && m.type === 'mute') applyMuteAndShow(m);
      });
    });

    publishPresence({ type: 'join', name: currentUser, ts: Date.now() });
    startPing();
    startPresencePolling();

    connectChatStream();
    connectMutesStream();

    cleanupTimer = setInterval(updateOnlineCount, 8000);
    tickTimer = setInterval(function () {
      if (!currentUser) return;
      const now = Date.now();
      let changed = false;
      for (const k in activeMutes) {
        if (activeMutes[k].until <= now) { delete activeMutes[k]; changed = true; }
      }
      if (changed) saveMutes();
      updateMuteUI();
    }, 1000);

    setTimeout(function () { msgInput.focus(); scrollToBottom(false); }, 60);
  }

  function logout() {
    if (currentUser) {
      publishPresence({ type: 'leave', name: currentUser, ts: Date.now() });
      delete onlineUsers[currentUser.toLowerCase()];
    }
    stopPing();
    stopPresencePolling();
    if (cleanupTimer) { clearInterval(cleanupTimer); cleanupTimer = null; }
    if (tickTimer)    { clearInterval(tickTimer);    tickTimer = null; }
    if (chatStream)   { chatStream.close();  chatStream = null; }
    if (mutesStream)  { mutesStream.close(); mutesStream = null; }

    currentUser = null;
    try { sessionStorage.removeItem(ME_KEY); } catch (e) {}

    chatScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
    nameInput.value = '';
    clearError();
    nameInput.focus();
  }

  /* ==================== ОТПРАВКА ==================== */
  function sendMessage() {
    if (!currentUser) return;
    if (isMuted(currentUser.toLowerCase())) { updateMuteUI(); return; }

    const text = msgInput.value.trim();
    if (!text) return;

    const msg = {
      id: uid(),
      name: currentUser,
      text: text.slice(0, 2000),
      ts: Date.now()
    };

    saveToCache(msg);
    appendMessage(msg, true);
    publishChat(msg);

    msgInput.value = '';
    autoGrow();
    msgInput.focus();
  }

  function autoGrow() {
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 140) + 'px';
  }

  /* ==================== СОБЫТИЯ ==================== */
  joinBtn.addEventListener('click', tryJoin);

  nameInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); tryJoin(); }
  });
  nameInput.addEventListener('input', clearError);

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('input', autoGrow);
  msgInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  logoutBtn.addEventListener('click', logout);

  window.addEventListener('beforeunload', function () {
    if (currentUser) {
      try {
        const body = JSON.stringify({ type: 'leave', name: currentUser, ts: Date.now() });
        if (navigator.sendBeacon) navigator.sendBeacon(NTFY + '/' + TOPIC_PRESENCE, body);
        else fetch(NTFY + '/' + TOPIC_PRESENCE, { method: 'POST', body: body, keepalive: true });
      } catch (e) {}
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && currentUser) {
      publishPresence({ type: 'ping', name: currentUser, ts: Date.now() });
      pollPresence();
    }
  });

  /* ==================== СТАРТ ==================== */
  (function init() {
    let saved = null;
    try { saved = sessionStorage.getItem(ME_KEY); } catch (e) {}

    if (saved && isValidName(saved)) {
      currentUser = saved;
      enterChat();
    } else {
      loginScreen.classList.remove('hidden');
      chatScreen.classList.add('hidden');
      setTimeout(function () { nameInput.focus(); }, 200);
    }
  })();

})();
</script>
</body>
</html>
