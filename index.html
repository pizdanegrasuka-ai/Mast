<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mast — мессенджер</title>
<style>
/* ============ БАЗА ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05080f;
  --panel:#0a1120;
  --panel2:#0f1a2e;
  --panel3:#132038;
  --line:rgba(56,189,248,.10);
  --line2:rgba(56,189,248,.28);
  --accent:#38bdf8;
  --accent2:#0ea5e9;
  --accent3:#22d3ee;
  --text:#e8f2ff;
  --muted:#7b8ea9;
  --green:#34d399;
  --red:#f87171;
  --radius:16px;
}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.18);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(56,189,248,.32)}
.hidden{display:none !important}

/* ============ ЭКРАН АВТОРИЗАЦИИ ============ */
#auth{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(900px 600px at 15% 10%, rgba(14,165,233,.16), transparent 60%),
    radial-gradient(800px 600px at 85% 90%, rgba(34,211,238,.12), transparent 60%),
    radial-gradient(600px 400px at 50% 50%, rgba(56,189,248,.06), transparent 70%),
    var(--bg);
  z-index:50;padding:20px;
}
#auth::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(56,189,248,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,.035) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(circle at 50% 50%, #000 20%, transparent 78%);
  pointer-events:none;
}
.auth-card{
  position:relative;width:100%;max-width:420px;
  background:linear-gradient(160deg, rgba(19,32,56,.92), rgba(10,17,32,.96));
  border:1px solid var(--line2);
  border-radius:26px;padding:38px 34px 30px;
  box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(56,189,248,.05) inset, 0 0 70px rgba(14,165,233,.10);
  backdrop-filter:blur(14px);
  animation:pop .45s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.logo{
  font-size:40px;font-weight:800;letter-spacing:-1.5px;text-align:center;
  background:linear-gradient(120deg,#e8f2ff 10%, var(--accent) 45%, var(--accent3) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(56,189,248,.35));
}
.tagline{text-align:center;color:var(--muted);font-size:13.5px;margin:8px 0 26px}
.auth-tabs{
  display:flex;background:rgba(5,8,15,.7);border-radius:13px;padding:4px;margin-bottom:22px;
  border:1px solid var(--line);
}
.auth-tab{
  flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);
  transition:.2s;
}
.auth-tab.active{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#04121f;box-shadow:0 6px 20px rgba(14,165,233,.35);
}
.fld{display:block;font-size:12px;color:var(--muted);margin:14px 0 7px;font-weight:600;letter-spacing:.3px}
.inp{
  width:100%;padding:13px 15px;border-radius:12px;
  background:rgba(5,8,15,.75);
  border:1px solid var(--line);
  color:var(--text);font-size:14.5px;transition:.2s;
}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.13);background:rgba(5,8,15,.95)}
.inp::placeholder{color:#4a5a72}
.btn-primary{
  width:100%;margin-top:22px;padding:14px;border-radius:13px;font-size:15px;font-weight:700;
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04121f;
  box-shadow:0 10px 28px rgba(14,165,233,.35);transition:.2s;letter-spacing:.2px;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(14,165,233,.5)}
.btn-primary:active{transform:translateY(0)}
.auth-error{
  color:var(--red);font-size:12.5px;text-align:center;margin-top:12px;min-height:16px;font-weight:500;
}

/* ============ ОСНОВНОЕ ПРИЛОЖЕНИЕ ============ */
#app{display:flex;height:100vh;width:100vw}

/* --- Сайдбар --- */
.sidebar{
  width:340px;flex:0 0 340px;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel),#070d18);
  border-right:1px solid var(--line);
}
.side-head{
  display:flex;align-items:center;gap:12px;padding:16px 16px 12px;
}
.me{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.me-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-status{font-size:11.5px;color:var(--accent);display:flex;align-items:center;gap:5px;margin-top:2px}
.me-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.icon-btn{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--muted);transition:.18s;border:1px solid transparent;
}
.icon-btn:hover{background:rgba(56,189,248,.09);color:var(--accent);border-color:var(--line2)}

.search{padding:0 16px 12px;position:relative}
.search .inp{padding:11px 14px 11px 38px;font-size:13.5px;border-radius:12px}
.search::before{
  content:'⌕';position:absolute;left:29px;top:50%;transform:translateY(-60%);
  color:var(--muted);font-size:17px;pointer-events:none;
}
.side-tabs{display:flex;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.side-tab{
  flex:1;padding:9px 6px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);
  transition:.18s;position:relative;
}
.side-tab:hover{color:var(--text);background:rgba(56,189,248,.05)}
.side-tab.active{
  color:var(--accent);background:rgba(56,189,248,.10);
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.22);
}
.badge{
  display:none;position:absolute;top:3px;right:6px;min-width:16px;height:16px;
  border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  align-items:center;justify-content:center;padding:0 4px;line-height:1;
}
.badge.show{display:inline-flex}

.list{flex:1;overflow-y:auto;padding:10px 10px 20px}
.empty-block{text-align:center;padding:46px 20px;color:var(--muted);font-size:13px;line-height:1.6}
.empty-block .ico{font-size:34px;margin-bottom:10px;opacity:.5}
.empty-block b{display:block;color:var(--text);font-size:14.5px;margin-bottom:6px}

.row{
  display:flex;gap:12px;padding:10px;border-radius:14px;cursor:pointer;
  align-items:center;transition:.15s;position:relative;
}
.row:hover{background:rgba(56,189,248,.06)}
.row.active{
  background:linear-gradient(90deg,rgba(56,189,248,.18),rgba(56,189,248,.04));
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.25);
}
.avatar{
  width:44px;height:44px;border-radius:50%;background-size:cover;background-position:center;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#04121f;
  font-size:15px;flex:0 0 auto;letter-spacing:.4px;user-select:none;
  box-shadow:0 0 0 2px rgba(56,189,248,.12);
}
.row-av{position:relative;flex:0 0 auto}
.dot{
  position:absolute;right:-1px;bottom:1px;width:13px;height:13px;border-radius:50%;
  background:var(--green);border:2.5px solid var(--panel);
}
.row-main{flex:1;min-width:0}
.row-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:10.5px;color:var(--muted);flex:0 0 auto}
.row-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:3px}
.row-prev{
  font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.unread{
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04121f;
  font-size:10.5px;font-weight:800;min-width:19px;height:19px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;padding:0 6px;flex:0 0 auto;
}
.row-actions{display:flex;gap:6px;flex:0 0 auto}
.mini-btn{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;background:rgba(56,189,248,.08);border:1px solid var(--line);
  transition:.18s;color:var(--accent);
}
.mini-btn:hover{background:rgba(56,189,248,.2);transform:translateY(-1px)}
.mini-btn.danger{color:var(--red);background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.2)}
.mini-btn.danger:hover{background:rgba(248,113,113,.2)}
.mini-btn.ok{color:var(--green);background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.2)}
.mini-btn.ok:hover{background:rgba(52,211,153,.2)}

.add-friend{display:flex;gap:8px;padding:6px 6px 14px}
.add-friend .inp{flex:1;padding:11px 13px;font-size:13px}
.add-friend button{
  width:44px;border-radius:12px;font-size:20px;font-weight:400;
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04121f;
  box-shadow:0 6px 18px rgba(14,165,233,.3);transition:.18s;
}
.add-friend button:hover{transform:translateY(-1px)}

/* --- Чат --- */
.chat{flex:1;display:flex;flex-direction:column;position:relative;min-width:0;
  background:
    radial-gradient(700px 500px at 80% 0%, rgba(14,165,233,.07), transparent 65%),
    radial-gradient(600px 500px at 10% 100%, rgba(34,211,238,.05), transparent 65%),
    var(--bg);
}
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);gap:6px;text-align:center;padding:30px;
}
.empty-icon{
  font-size:54px;margin-bottom:10px;filter:drop-shadow(0 0 24px rgba(56,189,248,.4));opacity:.85;
}
.empty h3{color:var(--text);font-size:19px;font-weight:700}
.empty p{font-size:13.5px;max-width:330px;line-height:1.6}

.chat-inner{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{
  display:flex;align-items:center;gap:13px;padding:13px 20px;
  border-bottom:1px solid var(--line);
  background:rgba(10,17,32,.72);backdrop-filter:blur(14px);z-index:5;
}
.chat-head-info{flex:1;min-width:0}
.chat-name{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sub{font-size:12px;color:var(--muted);margin-top:2px}
.chat-sub.online{color:var(--accent)}
.chat-actions{display:flex;gap:8px}
.chat-actions .icon-btn{background:rgba(56,189,248,.07);border:1px solid var(--line)}
.chat-actions .icon-btn:disabled{opacity:.3;cursor:not-allowed}
.chat-actions .icon-btn:disabled:hover{background:rgba(56,189,248,.07);color:var(--muted);transform:none}

.messages{
  flex:1;overflow-y:auto;padding:24px 26px 12px;display:flex;flex-direction:column;gap:3px;
  scroll-behavior:smooth;
}
.chat-empty{margin:auto;color:var(--muted);font-size:13.5px;text-align:center}
.day-sep{display:flex;justify-content:center;margin:16px 0 10px}
.day-sep span{
  font-size:11px;color:var(--muted);background:rgba(19,32,56,.85);
  padding:5px 14px;border-radius:11px;border:1px solid var(--line);font-weight:600;
}
.msg{display:flex;flex-direction:column;max-width:68%;margin:2px 0;animation:msgIn .22s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;align-items:flex-end}
.msg.in{align-self:flex-start;align-items:flex-start}
.bubble{
  padding:9px 14px;border-radius:17px;font-size:14.5px;line-height:1.42;
  word-break:break-word;white-space:pre-wrap;
}
.msg.in .bubble{
  background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:6px;
}
.msg.out .bubble{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#03111d;font-weight:500;border-bottom-right-radius:6px;
  box-shadow:0 6px 20px rgba(14,165,233,.22);
}
.msg-time{font-size:10.5px;color:var(--muted);margin:4px 7px 0}

.typing{
  padding:0 28px 6px;font-size:12px;color:var(--accent);height:18px;
  display:flex;align-items:center;gap:6px;
}
.typing .tdots span{
  display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--accent);
  margin-right:3px;animation:blink 1.2s infinite;
}
.typing .tdots span:nth-child(2){animation-delay:.2s}
.typing .tdots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.composer{
  display:flex;gap:10px;padding:14px 22px 18px;align-items:center;
  border-top:1px solid var(--line);background:rgba(10,17,32,.6);backdrop-filter:blur(12px);
}
.composer .inp{flex:1;border-radius:15px;padding:13px 17px;font-size:14.5px}
.send-btn{
  width:48px;height:48px;flex:0 0 auto;border-radius:15px;font-size:18px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:#04121f;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(14,165,233,.35);transition:.18s;
}
.send-btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 12px 30px rgba(14,165,233,.5)}
.send-btn:active{transform:scale(.96)}

/* ============ МОДАЛКА ============ */
.modal{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(3,6,12,.78);backdrop-filter:blur(7px);padding:20px;animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{
  position:relative;width:100%;max-width:420px;
  background:linear-gradient(160deg,rgba(19,32,56,.97),rgba(10,17,32,.99));
  border:1px solid var(--line2);border-radius:24px;padding:30px 28px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(14,165,233,.09);
  animation:pop .3s cubic-bezier(.2,.9,.3,1.2);
}
.modal-card h3{font-size:19px;font-weight:700;margin-bottom:20px}
.modal-close{
  position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:10px;
  color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;transition:.18s;
}
.modal-close:hover{background:rgba(248,113,113,.12);color:var(--red)}
.prof-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
.upload-btn{
  font-size:12.5px;color:var(--accent);cursor:pointer;padding:7px 15px;border-radius:10px;
  border:1px solid var(--line2);background:rgba(56,189,248,.07);transition:.18s;font-weight:600;
}
.upload-btn:hover{background:rgba(56,189,248,.18)}
.modal-actions{display:flex;gap:10px;margin-top:24px}
.btn-ghost{
  flex:1;padding:13px;border-radius:13px;font-size:14px;font-weight:600;
  background:rgba(248,113,113,.09);color:var(--red);border:1px solid rgba(248,113,113,.22);transition:.18s;
}
.btn-ghost:hover{background:rgba(248,113,113,.2)}
.modal-actions .btn-primary{margin-top:0;flex:1.6}

/* ============ ЗВОНОК ============ */
.call-overlay{
  position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
  background:
    radial-gradient(900px 700px at 50% 25%, rgba(14,165,233,.18), transparent 65%),
    radial-gradient(700px 600px at 50% 100%, rgba(34,211,238,.10), transparent 65%),
    #04070e;
  animation:fade .25s;
}
.call-overlay.video-on{background:#000}
#remote-video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .45s;background:#000;z-index:0;
}
.call-overlay.video-on #remote-video{opacity:1}
#local-video{
  position:absolute;right:22px;bottom:130px;width:180px;height:120px;object-fit:cover;
  border-radius:16px;border:1px solid var(--line2);background:#0a1120;
  box-shadow:0 12px 34px rgba(0,0,0,.6);z-index:3;transform:scaleX(-1);
}
#local-video.hidden{display:none}
.call-top{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;
  text-align:center;
}
.call-overlay.video-on .call-top{opacity:0;transition:.3s}
.call-top .avatar{box-shadow:0 0 0 4px rgba(56,189,248,.18), 0 0 70px rgba(56,189,248,.4);animation:pulse 2.4s infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 4px rgba(56,189,248,.18), 0 0 60px rgba(56,189,248,.35)}
  50%{box-shadow:0 0 0 12px rgba(56,189,248,.05), 0 0 90px rgba(56,189,248,.55)}
}
.call-name{font-size:26px;font-weight:800;letter-spacing:-.4px}
.call-status{font-size:14px;color:var(--accent);font-weight:600;letter-spacing:.4px}
.call-controls{
  position:absolute;bottom:52px;z-index:4;display:flex;gap:18px;align-items:center;
}
.cbtn{
  width:64px;height:64px;border-radius:50%;font-size:22px;
  display:flex;align-items:center;justify-content:center;transition:.18s;
  background:rgba(56,189,248,.12);border:1px solid var(--line2);color:var(--accent);
  backdrop-filter:blur(8px);
}
.cbtn:hover{transform:translateY(-3px) scale(1.05);background:rgba(56,189,248,.24)}
.cbtn:active{transform:scale(.95)}
.cbtn.off{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25)}
.cbtn.accept{
  background:linear-gradient(135deg,#10b981,#34d399);color:#04121f;border:none;
  box-shadow:0 10px 30px rgba(52,211,153,.45);animation:ring 1.5s infinite;
}
@keyframes ring{0%,100%{box-shadow:0 10px 30px rgba(52,211,153,.45)}50%{box-shadow:0 10px 46px rgba(52,211,153,.75)}}
.cbtn.decline{
  background:linear-gradient(135deg,#ef4444,#f87171);color:#fff;border:none;
  box-shadow:0 10px 30px rgba(248,113,113,.45);
}

/* ============ ТОСТ ============ */
.toast{
  position:fixed;bottom:30px;left:50%;transform:translate(-50%,26px);
  background:linear-gradient(135deg,rgba(19,32,56,.98),rgba(10,17,32,.98));
  border:1px solid var(--line2);color:var(--text);
  padding:13px 24px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:0 16px 44px rgba(0,0,0,.6), 0 0 30px rgba(14,165,233,.14);
  opacity:0;transition:.3s cubic-bezier(.2,.9,.3,1.2);z-index:200;pointer-events:none;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .sidebar{width:100%;flex:1 1 100%;border-right:none}
  .chat{position:fixed;inset:0;z-index:20}
  #app.chat-closed .chat{display:none}
  #local-video{width:110px;height:80px;bottom:120px;right:14px}
  .messages{padding:16px 14px 8px}
  .msg{max-width:84%}
}
</style>
</head>
<body>

<!-- ================= АВТОРИЗАЦИЯ ================= -->
<div id="auth">
  <div class="auth-card">
    <div class="logo">Mast</div>
    <div class="tagline">Общайся. Звони. Будь на связи.</div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">Вход</button>
      <button class="auth-tab" data-mode="register">Регистрация</button>
    </div>

    <label class="fld">Юзернейм</label>
    <input id="auth-username" class="inp" placeholder="например, alex_01" autocomplete="off" spellcheck="false">

    <label class="fld">Пароль</label>
    <input id="auth-password" class="inp" type="password" placeholder="••••••••" autocomplete="off">

    <button class="btn-primary" id="auth-submit">Войти</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- ================= ПРИЛОЖЕНИЕ ================= -->
<div id="app" class="hidden">

  <aside class="sidebar">
    <div class="side-head">
      <div class="me">
        <div id="me-avatar"></div>
        <div style="min-width:0">
          <div class="me-name" id="me-name">—</div>
          <div class="me-status">в сети</div>
        </div>
      </div>
      <button class="icon-btn" id="btn-profile" title="Профиль">⚙</button>
    </div>

    <div class="search">
      <input id="search" class="inp" placeholder="Поиск по юзернейму...">
    </div>

    <div class="side-tabs">
      <button class="side-tab active" data-tab="chats">Чаты</button>
      <button class="side-tab" data-tab="friends">Друзья</button>
      <button class="side-tab" data-tab="requests">Заявки<span class="badge" id="req-badge"></span></button>
    </div>

    <div class="list" id="list"></div>
  </aside>

  <main class="chat" id="chat">
    <div class="empty" id="empty-state">
      <div class="empty-icon">💬</div>
      <h3>Выберите чат</h3>
      <p>Откройте диалог слева или добавьте нового друга по юзернейму во вкладке «Друзья»</p>
    </div>

    <div class="chat-inner hidden" id="chat-inner">
      <header class="chat-head">
        <div id="chat-avatar"></div>
        <div class="chat-head-info">
          <div class="chat-name" id="chat-name">—</div>
          <div class="chat-sub" id="chat-sub">—</div>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" id="btn-audio" title="Аудиозвонок">📞</button>
          <button class="icon-btn" id="btn-video" title="Видеозвонок">🎥</button>
        </div>
      </header>

      <div class="messages" id="messages"></div>
      <div class="typing" id="typing"></div>

      <div class="composer">
        <input id="msg-input" class="inp" placeholder="Написать сообщение..." autocomplete="off">
        <button class="send-btn" id="btn-send">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- ================= ПРОФИЛЬ ================= -->
<div id="profile" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" id="prof-close">✕</button>
    <h3>Профиль</h3>

    <div class="prof-avatar-wrap">
      <div id="prof-avatar"></div>
      <label class="upload-btn">Сменить аватар
        <input type="file" id="avatar-input" accept="image/*" hidden>
      </label>
    </div>

    <label class="fld">Юзернейм</label>
    <input id="prof-username" class="inp" disabled style="opacity:.55">

    <label class="fld">Отображаемое имя</label>
    <input id="prof-name" class="inp" placeholder="Как вас зовут?" maxlength="30">

    <label class="fld">О себе</label>
    <input id="prof-bio" class="inp" placeholder="Пара слов о себе" maxlength="60">

    <div class="modal-actions">
      <button class="btn-ghost" id="logout-btn">Выйти</button>
      <button class="btn-primary" id="prof-save">Сохранить</button>
    </div>
  </div>
</div>

<!-- ================= ЗВОНОК ================= -->
<div id="call" class="call-overlay hidden">
  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted class="hidden"></video>

  <div class="call-top">
    <div id="call-avatar"></div>
    <div class="call-name" id="call-name">—</div>
    <div class="call-status" id="call-status">Вызов...</div>
  </div>

  <div class="call-controls" id="call-controls"></div>
</div>

<script>
/* =========================================================
   Mast — мессенджер (одностраничное приложение)
   Хранилище: localStorage + BroadcastChannel для синхронизации
   между вкладками одного браузера.
   ========================================================= */

/* ---------- Утилиты ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const LS = {
  get(k, d){ try{ const v = localStorage.getItem('mast_' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('mast_' + k, JSON.stringify(v)); }catch(e){ console.warn('storage full', e); } }
};

function hashPass(s){
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return 'm' + (h >>> 0).toString(36) + '_' + s.length;
}

const COLORS = ['#0ea5e9','#38bdf8','#22d3ee','#3b82f6','#6366f1','#06b6d4','#8b5cf6','#0d9488'];
function colorFor(u){ let h = 0; for (const ch of String(u)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }

function avatarHTML(username, size = 44){
  const u = users[username] || {};
  if (u.avatar) return `<div class="avatar" style="width:${size}px;height:${size}px;background-image:url('${u.avatar}')"></div>`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${colorFor(username)}">${esc(String(username).slice(0,2).toUpperCase())}</div>`;
}

function fmtTime(ts){
  const d = new Date(ts);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function fmtDay(ts){
  const d = new Date(ts), now = new Date();
  const d1 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const d2 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((d2 - d1) / 86400000);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}
function fmtDuration(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 320); }, 2600);
}

function resizeImage(file, maxSize, cb){
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = () => {
    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
    const w = Math.max(1, Math.round(img.width * scale));
    const h = Math.max(1, Math.round(img.height * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    cb(c.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Не удалось загрузить изображение'); };
  img.src = url;
}

/* ---------- Состояние ---------- */
let users        = LS.get('users', {});
let friendsMap   = LS.get('friends', {});
let requestsMap  = LS.get('requests', {});
let messagesMap  = LS.get('messages', {});

let me = null;
let currentChat = null;
let activeTab = 'chats';
let searchQuery = '';
const online = new Map(); // username -> timestamp

function reloadState(){
  users       = LS.get('users', {});
  friendsMap  = LS.get('friends', {});
  requestsMap = LS.get('requests', {});
  messagesMap = LS.get('messages', {});
}
function saveState(){
  LS.set('users', users);
  LS.set('friends', friendsMap);
  LS.set('requests', requestsMap);
  LS.set('messages', messagesMap);
}

/* ---------- Канал синхронизации ---------- */
const bc = new BroadcastChannel('mast');

function commit(){
  saveState();
  bc.postMessage({ type: 'sync' });
}

bc.onmessage = e => {
  const m = e.data;
  if (!m || !m.type) return;

  if (m.type === 'sync'){
    reloadState();
    if (me) renderAll();
  }
  else if (m.type === 'presence'){
    if (m.user && m.user !== me){
      const wasOffline = !online.has(m.user);
      online.set(m.user, Date.now());
      if (wasOffline) renderList();
    }
  }
  else if (m.type === 'who'){
    if (me) bc.postMessage({ type: 'presence', user: me });
  }
  else if (m.type === 'offline'){
    if (online.delete(m.user)) renderList();
  }
  else if (m.type === 'typing'){
    if (m.to === me && m.from === currentChat) showTyping();
  }
  else if (m.type.startsWith('call-')){
    handleCallSignal(m);
  }
};

/* ---------- Присутствие ---------- */
setInterval(() => {
  if (!me) return;
  bc.postMessage({ type: 'presence', user: me });
  const now = Date.now();
  let changed = false;
  for (const [u, t] of [...online]){
    if (now - t > 6500){ online.delete(u); changed = true; }
  }
  if (changed) renderList();
}, 2200);

window.addEventListener('beforeunload', () => {
  if (me) bc.postMessage({ type: 'offline', user: me });
});

/* =========================================================
   АВТОРИЗАЦИЯ
   ========================================================= */
let authMode = 'login';

$$('.auth-tab').forEach(tab => {
  tab.onclick = () => {
    authMode = tab.dataset.mode;
    $$('.auth-tab').forEach(t => t.classList.toggle('active', t === tab));
    $('#auth-submit').textContent = authMode === 'login' ? 'Войти' : 'Создать аккаунт';
    $('#auth-error').textContent = '';
  };
});

function authError(msg){ $('#auth-error').textContent = msg; }

$('#auth-submit').onclick = doAuth;
$('#auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
$('#auth-username').addEventListener('keydown', e => { if (e.key === 'Enter') $('#auth-password').focus(); });

function doAuth(){
  const u = $('#auth-username').value.trim().toLowerCase();
  const p = $('#auth-password').value;
  authError('');

  if (!u) return authError('Введите юзернейм');
  if (!p) return authError('Введите пароль');

  if (authMode === 'register'){
    if (!/^[a-z0-9_]{3,16}$/.test(u))
      return authError('Юзернейм: 3–16 символов (a-z, 0-9, _)');
    if (p.length < 4)
      return authError('Пароль минимум 4 символа');
    if (users[u])
      return authError('Этот юзернейм уже занят');

    users[u] = {
      username: u,
      pass: hashPass(p),
      avatar: null,
      name: u,
      bio: '',
      created: Date.now(),
      unread: {}
    };
    friendsMap[u]  = friendsMap[u]  || [];
    requestsMap[u] = requestsMap[u] || [];
    commit();
    loginAs(u);
    toast('Добро пожаловать в Mast, @' + u + '!');
  } else {
    if (!users[u]) return authError('Пользователь не найден');
    if (users[u].pass !== hashPass(p)) return authError('Неверный пароль');
    loginAs(u);
  }
}

function loginAs(username){
  me = username;
  LS.set('session', username);

  if (!users[me].unread) users[me].unread = {};
  if (!friendsMap[me]) friendsMap[me] = [];
  if (!requestsMap[me]) requestsMap[me] = [];
  saveState();

  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#auth-password').value = '';

  bc.postMessage({ type: 'who' });
  bc.postMessage({ type: 'presence', user: me });

  currentChat = null;
  activeTab = 'chats';
  $$('.side-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'chats'));

  renderAll();
}

function logout(){
  if (me) bc.postMessage({ type: 'offline', user: me });
  if (call) cleanupCall(true);
  me = null;
  currentChat = null;
  LS.set('session', null);
  $('#app').classList.add('hidden');
  $('#auth').classList.remove('hidden');
  $('#profile').classList.add('hidden');
  $('#auth-username').value = '';
  $('#auth-password').value = '';
  authError('');
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
function renderAll(){
  if (!me) return;
  renderMe();
  renderList();
  renderChat();
}

function renderMe(){
  $('#me-avatar').innerHTML = avatarHTML(me, 44);
  $('#me-name').textContent = users[me]?.name || me;
}

/* ---------- Список (сайдбар) ---------- */
function convKey(a, b){ return [a, b].sort().join('|'); }

function lastMsgTime(user){
  const arr = messagesMap[convKey(me, user)] || [];
  return arr.length ? arr[arr.length - 1].at : 0;
}

function renderList(){
  if (!me) return;
  const list = $('#list');
  const q = searchQuery.trim().toLowerCase();

  // счётчик заявок
  const reqs = (requestsMap[me] || []);
  const badge = $('#req-badge');
  badge.textContent = reqs.length;
  badge.classList.toggle('show', reqs.length > 0);

  /* --- ЧАТЫ --- */
  if (activeTab === 'chats'){
    let items = (friendsMap[me] || []).slice();
    if (q) items = items.filter(u => u.includes(q) || (users[u]?.name || '').toLowerCase().includes(q));
    items.sort((a, b) => lastMsgTime(b) - lastMsgTime(a));

    if (!items.length){
      list.innerHTML = `<div class="empty-block"><div class="ico">👥</div><b>Пока нет чатов</b>
        Добавьте друга во вкладке «Друзья», чтобы начать общение</div>`;
      return;
    }

    list.innerHTML = items.map(u => {
      const key = convKey(me, u);
      const msgs = messagesMap[key] || [];
      const last = msgs[msgs.length - 1];
      const unread = (users[me].unread || {})[key] || 0;
      let preview = 'Нет сообщений';
      if (last) preview = (last.from === me ? 'Вы: ' : '') + last.text;

      return `<div class="row ${currentChat === u ? 'active' : ''}" data-user="${esc(u)}">
        <div class="row-av">${avatarHTML(u, 46)}${online.has(u) ? '<span class="dot"></span>' : ''}</div>
        <div class="row-main">
          <div class="row-top">
            <span class="row-name">${esc(users[u]?.name || u)}</span>
            <span class="row-time">${last ? fmtTime(last.at) : ''}</span>
          </div>
          <div class="row-bottom">
            <span class="row-prev">${esc(preview)}</span>
            ${unread ? `<span class="unread">${unread > 99 ? '99+' : unread}</span>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
    return;
  }

  /* --- ДРУЗЬЯ --- */
  if (activeTab === 'friends'){
    let items = (friendsMap[me] || []).slice();
    if (q) items = items.filter(u => u.includes(q) || (users[u]?.name || '').toLowerCase().includes(q));
    items.sort((a, b) => a.localeCompare(b));

    let html = `<div class="add-friend">
      <input class="inp" id="add-friend-input" placeholder="Юзернейм друга..." autocomplete="off" spellcheck="false">
      <button id="add-friend-btn" title="Отправить заявку">+</button>
    </div>`;

    if (!items.length){
      html += `<div class="empty-block"><div class="ico">🔍</div><b>Список друзей пуст</b>
        Введите юзернейм выше и отправьте заявку</div>`;
    } else {
      html += items.map(u => `
        <div class="row" data-user="${esc(u)}">
          <div class="row-av">${avatarHTML(u, 46)}${online.has(u) ? '<span class="dot"></span>' : ''}</div>
          <div class="row-main">
            <div class="row-top"><span class="row-name">${esc(users[u]?.name || u)}</span></div>
            <div class="row-bottom"><span class="row-prev">@${esc(u)} · ${online.has(u) ? 'в сети' : 'не в сети'}</span></div>
          </div>
          <div class="row-actions">
            <button class="mini-btn" data-act="chat" data-user="${esc(u)}" title="Написать">💬</button>
            <button class="mini-btn danger" data-act="unfriend" data-user="${esc(u)}" title="Удалить">✕</button>
          </div>
        </div>`).join('');
    }
    list.innerHTML = html;

    const inp = $('#add-friend-input');
    const btn = $('#add-friend-btn');
    const send = () => { sendFriendRequest(inp.value); inp.value = ''; };
    btn.onclick = send;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    return;
  }

  /* --- ЗАЯВКИ --- */
  if (activeTab === 'requests'){
    if (!reqs.length){
      list.innerHTML = `<div class="empty-block"><div class="ico">📨</div><b>Заявок нет</b>
        Здесь появятся запросы в друзья от других пользователей</div>`;
      return;
    }
    list.innerHTML = reqs.map(r => `
      <div class="row" data-user="${esc(r.from)}">
        <div class="row-av">${avatarHTML(r.from, 46)}${online.has(r.from) ? '<span class="dot"></span>' : ''}</div>
        <div class="row-main">
          <div class="row-top"><span class="row-name">${esc(users[r.from]?.name || r.from)}</span></div>
          <div class="row-bottom"><span class="row-prev">@${esc(r.from)} · хочет добавить вас</span></div>
        </div>
        <div class="row-actions">
          <button class="mini-btn ok" data-act="accept" data-user="${esc(r.from)}" title="Принять">✓</button>
          <button class="mini-btn danger" data-act="decline" data-user="${esc(r.from)}" title="Отклонить">✕</button>
        </div>
      </div>`).join('');
  }
}

/* ---------- Делегирование кликов по списку ---------- */
$('#list').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (btn){
    e.stopPropagation();
    const u = btn.dataset.user;
    const act = btn.dataset.act;
    if (act === 'chat'){ openChat(u); if (window.innerWidth <= 760) $('#app').classList.remove('chat-closed'); }
    if (act === 'unfriend') removeFriend(u);
    if (act === 'accept') acceptRequest(u);
    if (act === 'decline') declineRequest(u);
    return;
  }
  const row = e.target.closest('.row');
  if (row && row.dataset.user){
    openChat(row.dataset.user);
    if (window.innerWidth <= 760) $('#app').classList.remove('chat-closed');
  }
});

/* ---------- Вкладки ---------- */
$$('.side-tab').forEach(tab => {
  tab.onclick = () => {
    activeTab = tab.dataset.tab;
    $$('.side-tab').forEach(t => t.classList.toggle('active', t === tab));
    renderList();
  };
});

/* ---------- Поиск ---------- */
$('#search').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderList();
});

/* =========================================================
   ДРУЗЬЯ
   ========================================================= */
function sendFriendRequest(rawUsername){
  if (!me) return;
  const target = String(rawUsername || '').trim().toLowerCase().replace(/^@/, '');

  if (!target) return toast('Введите юзернейм');
  if (target === me) return toast('Это ваш собственный юзернейм');
  if (!users[target]) return toast('Пользователь @' + target + ' не найден');
  if ((friendsMap[me] || []).includes(target)) return toast('@' + target + ' уже в друзьях');

  if ((requestsMap[target] || []).some(r => r.from === me))
    return toast('Заявка уже отправлена');

  // если от него уже есть заявка — принимаем сразу
  if ((requestsMap[me] || []).some(r => r.from === target)){
    acceptRequest(target);
    return;
  }

  requestsMap[target] = requestsMap[target] || [];
  requestsMap[target].push({ from: me, at: Date.now() });

  commit();
  renderList();
  toast('Заявка отправлена @' + target);
}

function acceptRequest(from){
  requestsMap[me] = (requestsMap[me] || []).filter(r => r.from !== from);

  friendsMap[me] = friendsMap[me] || [];
  if (!friendsMap[me].includes(from)) friendsMap[me].push(from);

  friendsMap[from] = friendsMap[from] || [];
  if (!friendsMap[from].includes(me)) friendsMap[from].push(me);

  commit();
  renderAll();
  toast('@' + from + ' теперь у вас в друзьях');
}

function declineRequest(from){
  requestsMap[me] = (requestsMap[me] || []).filter(r => r.from !== from);
  commit();
  renderList();
  toast('Заявка отклонена');
}

function removeFriend(u){
  if (!confirm('Удалить @' + u + ' из друзей?')) return;
  friendsMap[me] = (friendsMap[me] || []).filter(x => x !== u);
  friendsMap[u]  = (friendsMap[u]  || []).filter(x => x !== me);
  if (currentChat === u) currentChat = null;
  commit();
  renderAll();
}

/* =========================================================
   ЧАТ
   ========================================================= */
function openChat(username){
  if (!users[username]) return;
  currentChat = username;

  const key = convKey(me, username);
  users[me].unread = users[me].unread || {};
  if (users[me].unread[key]){ delete users[me].unread[key]; saveState(); }

  renderChat();
  renderList();
  setTimeout(() => $('#msg-input')?.focus(), 50);
}

function renderChat(){
  if (!me) return;

  if (!currentChat){
    $('#empty-state').classList.remove('hidden');
    $('#chat-inner').classList.add('hidden');
    return;
  }

  $('#empty-state').classList.add('hidden');
  $('#chat-inner').classList.remove('hidden');

  const u = currentChat;
  const isFriend = (friendsMap[me] || []).includes(u);

  $('#chat-avatar').innerHTML = avatarHTML(u, 44);
  $('#chat-name').textContent = users[u]?.name || u;

  const sub = $('#chat-sub');
  if (online.has(u)){ sub.textContent = 'в сети'; sub.classList.add('online'); }
  else { sub.textContent = '@' + u + ' · не в сети'; sub.classList.remove('online'); }

  $('#btn-audio').disabled = !isFriend;
  $('#btn-video').disabled = !isFriend;

  renderMessages();
}

function renderMessages(){
  const box = $('#messages');
  if (!currentChat) return;

  const key = convKey(me, currentChat);
  const msgs = messagesMap[key] || [];

  if (!msgs.length){
    box.innerHTML = `<div class="chat-empty">Начните переписку с <b>@${esc(currentChat)}</b> 👋</div>`;
    return;
  }

  let html = '';
  let lastDay = '';
  for (const m of msgs){
    const day = new Date(m.at).toDateString();
    if (day !== lastDay){
      lastDay = day;
      html += `<div class="day-sep"><span>${fmtDay(m.at)}</span></div>`;
    }
    html += `<div class="msg ${m.from === me ? 'out' : 'in'}">
      <div class="bubble">${esc(m.text)}</div>
      <div class="msg-time">${fmtTime(m.at)}</div>
    </div>`;
  }
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function sendMessage(){
  const input = $('#msg-input');
  const text = input.value.trim();
  if (!text || !currentChat || !me) return;

  const key = convKey(me, currentChat);
  messagesMap[key] = messagesMap[key] || [];
  messagesMap[key].push({ from: me, text, at: Date.now() });

  users[me].unread = users[me].unread || {};
  delete users[me].unread[key];

  input.value = '';
  commit();
  renderMessages();
  renderList();
}

/* =========================================================
   ЗВОНКИ (WebRTC + сигналинг через BroadcastChannel)
   ========================================================= */
let call = null;          // {peer, video, incoming, pc, localStream, offer, pending, connected}
let callTimerInt = null;
let callSeconds = 0;

const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

async function getLocalStream(video){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
  try {
    return await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: video ? { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } : false
    });
  } catch (err){
    console.warn('media error', err);
    return null;
  }
}

function attachLocalTracks(pc){
  if (call.localStream){
    call.localStream.getTracks().forEach(t => pc.addTrack(t, call.localStream));
  } else {
    pc.addTransceiver('audio', { direction: 'recvonly' });
    if (call.video) pc.addTransceiver('video', { direction: 'recvonly' });
  }
}

function createPC(peer){
  const pc = new RTCPeerConnection(RTC_CONFIG);

  pc.onicecandidate = e => {
    if (e.candidate){
      bc.postMessage({ type: 'call-ice', from: me, to: peer, candidate: e.candidate.toJSON() });
    }
  };

  pc.ontrack = e => {
    const rv = $('#remote-video');
    if (e.streams && e.streams[0]){
      if (rv.srcObject !== e.streams[0]) rv.srcObject = e.streams[0];
    }
    if (e.track.kind === 'video'){
      $('#call').classList.add('video-on');
    }
  };

  pc.onconnectionstatechange = () => {
    if (!call) return;
    const st = pc.connectionState;
    if (st === 'connected') onCallConnected();
    else if (st === 'failed'){ toast('Соединение потеряно'); cleanupCall(true); }
  };

  return pc;
}

async function startCall(video){
  if (!currentChat) return;
  if (call) return toast('Вы уже в звонке');

  const peer = currentChat;
  if (!(friendsMap[me] || []).includes(peer)) return toast('Звонить можно только друзьям');
  if (!online.has(peer)) return toast('@' + peer + ' не в сети');

  call = { peer, video, incoming: false, pc: null, localStream: null, pending: [], connected: false, offer: null };

  showCallUI('outgoing');
  setCallStatus('Вызов...');

  call.localStream = await getLocalStream(video);
  if (call.localStream && video){
    const lv = $('#local-video');
    lv.srcObject = call.localStream;
    lv.classList.remove('hidden');
  }

  const pc = createPC(peer);
  call.pc = pc;
  attachLocalTracks(pc);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  bc.postMessage({
    type: 'call-offer',
    from: me, to: peer,
    sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp },
    video
  });
}

async function acceptCall(){
  if (!call || !call.incoming) return;
  stopRing();

  const peer = call.peer;
  call.localStream = await getLocalStream(call.video);
  if (call.localStream && call.video){
    const lv = $('#local-video');
    lv.srcObject = call.localStream;
    lv.classList.remove('hidden');
  }

  const pc = createPC(peer);
  call.pc = pc;
  attachLocalTracks(pc);

  await pc.setRemoteDescription(call.offer);

  for (const c of call.pending){ try { await pc.addIceCandidate(c); } catch(e){} }
  call.pending = [];

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  bc.postMessage({
    type: 'call-answer',
    from: me, to: peer,
    sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp }
  });

  call.incoming = false;
  showCallUI('active');
  setCallStatus('Соединение...');
}

function declineCall(){
  if (!call) return;
  bc.postMessage({ type: 'call-decline', from: me, to: call.peer });
  cleanupCall(false);
  toast('Вызов отклонён');
}

function endCall(){
  if (!call) return;
  cleanupCall(true);
}

function cleanupCall(notify){
  stopRing();
  clearInterval(callTimerInt);
  callTimerInt = null;
  callSeconds = 0;

  if (!call){
    $('#call').classList.add('hidden');
    return;
  }

  if (notify) bc.postMessage({ type: 'call-end', from: me, to: call.peer });

  try { if (call.pc) call.pc.close(); } catch(e){}
  if (call.localStream) call.localStream.getTracks().forEach(t => t.stop());

  const lv = $('#local-video'), rv = $('#remote-video');
  lv.srcObject = null; rv.srcObject = null;
  lv.classList.add('hidden');

  call = null;
  $('#call').classList.add('hidden');
  $('#call').classList.remove('video-on');
  $('#call-controls').innerHTML = '';
}

function onCallConnected(){
  if (!call || call.connected) return;
  call.connected = true;
  callSeconds = 0;
  setCallStatus('00:00');
  clearInterval(callTimerInt);
  callTimerInt = setInterval(() => {
    callSeconds++;
    setCallStatus(fmtDuration(callSeconds));
  }, 1000);
}

function handleCallSignal(m){
  if (m.to !== me) return;

  switch (m.type){
    case 'call-offer': {
      if (call){
        bc.postMessage({ type: 'call-busy', from: me, to: m.from });
        return;
      }
      call = {
        peer: m.from, video: !!m.video, incoming: true,
        pc: null, localStream: null, pending: [], connected: false,
        offer: m.sdp
      };
      showCallUI('incoming');
      setCallStatus('Входящий ' + (m.video ? 'видеозвонок' : 'звонок'));
      startRing();
      break;
    }
    case 'call-answer': {
      if (!call || call.peer !== m.from || !call.pc) return;
      stopRing();
      call.pc.setRemoteDescription(m.sdp)
        .then(async () => {
          for (const c of call.pending){ try { await call.pc.addIceCandidate(c); } catch(e){} }
          call.pending = [];
        })
        .catch(err => console.warn(err));
      setCallStatus('Соединение...');
      break;
    }
    case 'call-ice': {
      if (!call || call.peer !== m.from) return;
      if (call.pc && call.pc.remoteDescription){
        call.pc.addIceCandidate(m.candidate).catch(() => {});
      } else {
        call.pending.push(m.candidate);
      }
      break;
    }
    case 'call-decline': {
      if (!call || call.peer !== m.from) return;
      cleanupCall(false);
      toast('Вызов отклонён');
      break;
    }
    case 'call-busy': {
      if (!call || call.peer !== m.from) return;
      cleanupCall(false);
      toast('Пользователь сейчас занят');
      break;
    }
    case 'call-end': {
      if (!call || call.peer !== m.from) return;
      cleanupCall(false);
      toast('Звонок завершён');
      break;
    }
  }
}

/* ---------- UI звонка ---------- */
function showCallUI(mode){
  const peer = call.peer;
  const overlay = $('#call');

  overlay.classList.remove('hidden');
  overlay.classList.toggle('video-on', false);

  $('#call-avatar').innerHTML = avatarHTML(peer, 110);
  $('#call-name').textContent = users[peer]?.name || peer;

  const controls = $('#call-controls');

  if (mode === 'incoming'){
    controls.innerHTML = `
      <button class="cbtn decline" id="c-decline" title="Отклонить">✕</button>
      <button class="cbtn accept" id="c-accept" title="Принять">✓</button>`;
    $('#c-decline').onclick = declineCall;
    $('#c-accept').onclick = acceptCall;
  } else {
    controls.innerHTML = `
      <button class="cbtn" id="c-mute" title="Микрофон">🎙</button>
      ${call.video ? '<button class="cbtn" id="c-cam" title="Камера">🎥</button>' : ''}
      <button class="cbtn decline" id="c-end" title="Завершить">📵</button>`;
    $('#c-end').onclick = endCall;

    const muteBtn = $('#c-mute');
    muteBtn.onclick = () => {
      if (!call || !call.localStream) return toast('Микрофон недоступен');
      const track = call.localStream.getAudioTracks()[0];
      if (!track) return;
      track.enabled = !track.enabled;
      muteBtn.classList.toggle('off', !track.enabled);
      muteBtn.textContent = track.enabled ? '🎙' : '🔇';
    };

    const camBtn = $('#c-cam');
    if (camBtn){
      camBtn.onclick = () => {
        if (!call || !call.localStream) return;
        const track = call.localStream.getVideoTracks()[0];
        if (!track) return;
        track.enabled = !track.enabled;
        camBtn.classList.toggle('off', !track.enabled);
        camBtn.textContent = track.enabled ? '🎥' : '🚫';
      };
    }
  }
}

function setCallStatus(text){ $('#call-status').textContent = text; }

$('#btn-audio').onclick = () => startCall(false);
$('#btn-video').onclick = () => startCall(true);

/* ---------- Рингтон ---------- */
let ringCtx = null, ringInt = null;
function startRing(){
  try {
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (ringCtx.state === 'suspended') ringCtx.resume();
    const beep = () => {
      if (!ringCtx) return;
      const o = ringCtx.createOscillator(), g = ringCtx.createGain();
      o.type = 'sine';
      o.frequency.value = 640;
      const t = ringCtx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.07, t + 0.04);
      g.gain.linearRampToValueAtTime(0, t + 0.45);
      o.connect(g); g.connect(ringCtx.destination);
      o.start(t); o.stop(t + 0.5);
    };
    beep();
    clearInterval(ringInt);
    ringInt = setInterval(beep, 1700);
  } catch(e){}
}
function stopRing(){ clearInterval(ringInt); ringInt = null; }

  setInterval(() => { if (me) renderList(); }, 5000);
})();
